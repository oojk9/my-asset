        ok: '삭제', danger: true,
      });
      if (!ok) return;
      state.assets = state.assets.filter(x => x.id !== a.id);
      saveState(); closeLayers(1); render(); toast('삭제했어요');
    });
  }, opts);
}

/* =========================================================
   8) 가계부 기록 · 수정 화면 (지출 · 수입 · 이체)
   ========================================================= */
function openTxForm(id, opts = {}) {
  const t = id ? state.txs.find(x => x.id === id) : null;
  if (id && !t) return;
  const dv = opts.draft || null;                                   // 이어서 쓰는 작성 중 기록
  const preset = dv ? { inboxId: dv.inboxId || '', smsHash: dv.smsHash || '' } : (opts.preset || {});
  let kind = t ? t.kind : (KINDS.includes(preset.kind) ? preset.kind : 'expense');
  const hasAccounts = state.assets.length > 0;
  const defDate = t ? t.date : (preset.date || ((ui.tab === 'ledger' || ui.tab === 'cards') && ui.month !== thisMonth() ? ui.month + '-01' : today()));

  // 직접 고친 금액에 이미 포함된 기록이면 알려주기
  let note = '';
  if (t) {
    const absorbed = [];
    const a1 = assetById(t.accountId);
    if (a1 && t.appliedAt <= a1.baseAt) absorbed.push(a1.name);
    const a2 = t.kind === 'transfer' ? assetById(t.toAccountId) : null;
    if (a2 && t.toAppliedAt <= a2.baseAt) absorbed.push(a2.name);
    if (absorbed.length) note = `<p class="hint">이 기록은 '${esc(absorbed.join("', '"))}' 금액을 직접 고치기 전에 입력돼서, 여기서 고쳐도 그 금액은 바뀌지 않아요.</p>`;
  }

  const html = `<form class="form" id="tx-form" novalidate autocomplete="off">
    ${preset.note ? `<p class="xfer-note sms-note" id="sms-note">${esc(preset.note)}</p>` : ''}
    ${preset.warn ? `<p class="xfer-note warn-note" id="sms-warn">⚠️ ${esc(preset.warn)}</p>` : ''}
    ${!t ? '<div class="form-tools"><button type="button" class="link" data-role="sms-paste">📩 문자 붙여넣기</button></div>' : ''}
    <div class="segmented" role="radiogroup" aria-label="구분">
      <label><input type="radio" name="kind" value="expense"${kind === 'expense' ? ' checked' : ''}><span>지출</span></label>
      <label><input type="radio" name="kind" value="income"${kind === 'income' ? ' checked' : ''}><span>수입</span></label>
      <label><input type="radio" name="kind" value="transfer"${kind === 'transfer' ? ' checked' : ''}><span>이체</span></label>
    </div>
    <div class="field">
      <label class="label" for="t-amount">금액</label>
      <div class="money-input big"><input class="input-money" id="t-amount" inputmode="numeric" placeholder="0" value="${t ? fmt(t.amount) : ''}" enterkeyhint="done"><span class="unit">원</span></div>
      <p class="hint reading" id="t-reading" aria-live="polite"></p>
      <div class="quick" role="group" aria-label="금액 빠르게 더하기">
        <button type="button" data-add="1000">+1천</button><button type="button" data-add="10000">+1만</button><button type="button" data-add="50000">+5만</button><button type="button" data-add="100000">+10만</button><button type="button" data-add="0">지우기</button>
      </div>
    </div>
    <fieldset class="field" id="f-cats">
      <legend class="label">분류</legend>
      <div class="chips" id="t-cats"></div>
    </fieldset>
    <div class="field" id="f-account">
      <label class="label" for="t-account" id="t-account-label">결제수단</label>
      <select class="input" id="t-account">${accountOptions('선택 안 함', { cardsFirst: true })}</select>
      <p class="hint" id="t-account-hint"></p>
    </div>
    <div class="field" id="f-xfer">
      <label class="label" for="t-from">보내는 곳 <span class="opt">(금액만큼 −)</span></label>
      <select class="input" id="t-from">${accountOptions('보내는 계좌 선택')}</select>
      <div class="swap-row"><button type="button" class="swap-btn" id="t-swap" aria-label="보내는 곳과 받는 곳 바꾸기">${ICON.swap}바꾸기</button></div>
      <label class="label" for="t-to">받는 곳 <span class="opt">(금액만큼 +)</span></label>
      <select class="input" id="t-to">${accountOptions('받는 계좌 선택')}</select>
      <div class="suggest" id="t-suggest" hidden></div>
      <p class="xfer-note" id="t-xfer-note"></p>
    </div>
    <div class="field">
      <label class="label" for="t-date">날짜</label>
      <input class="input" type="date" id="t-date" value="${esc(defDate)}" required>
    </div>
    <div class="field">
      <label class="label" for="t-memo">메모 <span class="opt">(선택)</span></label>
      <input class="input" id="t-memo" maxlength="100" value="${esc(t ? t.memo : '')}" placeholder="예) 점심, 10월 적금 납입" enterkeyhint="done">
    </div>
    ${note}
    <p class="error" id="t-error" role="alert"></p>
    <div class="form-actions">
      ${t ? '<button type="button" class="btn danger-ghost" data-role="delete">삭제</button>' : ''}
      <button type="submit" class="btn primary grow" id="t-submit">${t ? '저장' : '기록하기'}</button>
    </div>
  </form>`;

  openSheet(opts.title || (t ? '가계부 수정' : '가계부 기록'), html, root => {
    const amtEl = $('#t-amount', root), catsEl = $('#t-cats', root), accEl = $('#t-account', root);
    const fromEl = $('#t-from', root), toEl = $('#t-to', root), noteEl = $('#t-xfer-note', root);
    const dateEl = $('#t-date', root), memoEl = $('#t-memo', root), errEl = $('#t-error', root);
    const exists = v => !!v && state.assets.some(a => a.id === v);
    const pick = (el, v) => { el.value = exists(v) ? v : ''; };
    let cat = t && t.kind !== 'transfer' ? t.category : (CAT[preset.category] ? preset.category : null);
    const pasteBtn = root.querySelector('[data-role="sms-paste"]');
    if (pasteBtn) pasteBtn.addEventListener('click', () => openSmsPaste('', { replace: true }));

    // 처음 값 채우기
    if (t) {
      if (t.kind === 'transfer') { pick(fromEl, t.accountId); pick(toEl, t.toAccountId); }
      else pick(accEl, t.accountId);
    } else {
      const la = state.settings.lastAccount;
      const firstCard = (cards()[0] || {}).id;
      pick(accEl, [preset.account, la[kind], kind === 'expense' ? firstCard : ''].find(exists) || '');
      if (preset.amount > 0) amtEl.value = fmt(preset.amount);
      if (preset.memo) memoEl.value = preset.memo;
      const firstCash = (state.assets.find(a => a.type === 'cash') || {}).id;
      pick(fromEl, preset.from || la.transferFrom || firstCash);
      pick(toEl, preset.to || la.transferTo);
      if (preset.from && !preset.to && toEl.value === fromEl.value) toEl.value = '';
      if (preset.to && !preset.from) {
        pick(fromEl, la.transferFrom || firstCash);
        if (fromEl.value === toEl.value) fromEl.value = '';
      }
      if (fromEl.value && fromEl.value === toEl.value) toEl.value = '';
    }

    const drawCats = () => {
      const list = catsOf(kind);
      if (!list.some(c => c.id === cat)) cat = list[0].id;
      catsEl.innerHTML = list.map(c => `<label class="chip"><input type="radio" name="cat" value="${c.id}"${c.id === cat ? ' checked' : ''}><span><span aria-hidden="true">${c.icon}</span>${esc(c.label)}</span></label>`).join('');
    };
    const updateNote = () => {
      const n = parseAmount(amtEl.value);
      const from = assetById(fromEl.value), to = assetById(toEl.value);
      const money = n ? fmt(n) + '원' : '금액';
      if (state.assets.length < 2) { noteEl.textContent = '이체하려면 자산 탭에 계좌를 2개 이상 등록해 주세요.'; return; }
      if (from && to && from.id === to.id) { noteEl.textContent = '보내는 곳과 받는 곳이 같아요. 다른 계좌를 골라 주세요.'; return; }
      const parts = [];
      if (from) parts.push(`${from.name} ${isCard(from) ? '카드값 +' : isLiab(from) ? '부채 +' : '−'}${money}`);
      if (to) parts.push(`${to.name} ${isCard(to) ? '카드값 −' : isLiab(to) ? '부채 −' : '+'}${money}`);
      noteEl.textContent = parts.length === 2
        ? `${parts[0]}  →  ${parts[1]} · 순자산은 그대로예요`
        : '보내는 곳은 금액만큼 줄고(−), 받는 곳은 늘어나요(+). 순자산은 그대로예요.';
    };
    // 받는 곳이 카드면 결제할 금액을 버튼으로 제안
    const suggestEl = $('#t-suggest', root);
    const updateSuggest = () => {
      const to = assetById(toEl.value);
      const items = [];
      if (kind === 'transfer' && isCard(to)) {
        const full = Math.max(0, balanceOf(to)), prev = cardPrevUnpaid(to);
        if (prev > 0 && prev !== full) items.push(['지난달까지 쓴 금액', prev]);
        if (full > 0) items.push(['결제할 금액 전체', full]);
      }
      suggestEl.hidden = !items.length;
      suggestEl.innerHTML = items.map(([l, v]) => `<button type="button" data-fill="${v}">${esc(l)} ${esc(fmt(v))}원</button>`).join('');
    };
    const updateAccHint = () => {
      const a = assetById(accEl.value), el = $('#t-account-hint', root);
      if (!state.assets.length) el.textContent = '자산 탭에 계좌·카드를 등록하면 금액과 연결할 수 있어요.';
      else if (!a) el.textContent = '고르면 그 계좌(카드)의 금액이 자동으로 바뀌어요.';
      else if (isCard(a)) el.textContent = kind === 'income' ? '카드 취소·환불이면 카드값이 줄어요.' : '카드값(결제할 금액)에 쌓였다가, [카드값 결제]를 할 때 통장에서 빠져요.';
      else if (isLiab(a)) el.textContent = kind === 'income' ? '이 부채가 줄어요.' : '이 부채가 늘어나요.';
      else el.textContent = kind === 'income' ? '이 계좌 잔액이 늘어요.' : '이 계좌 잔액이 바로 줄어요.';
    };
    const applyKind = () => {
      const isX = kind === 'transfer';
      $('#f-cats', root).hidden = isX;
      $('#f-account', root).hidden = isX;
      $('#f-xfer', root).hidden = !isX;
      root.querySelector('.segmented').dataset.kind = kind;
      $('#t-account-label', root).textContent = kind === 'income' ? '어느 계좌로 들어왔나요?' : '결제수단';
      $('#t-submit', root).textContent = t ? '저장' : (isX ? (isCard(assetById(toEl.value)) ? '카드값 결제 기록하기' : '이체 기록하기') : '기록하기');
      if (!isX) drawCats();
      updateNote(); updateSuggest(); updateAccHint();
      errEl.textContent = '';
    };
    const setKind = k => {
      const prev = kind;
      kind = k;
      // 종류를 바꿀 때 고른 계좌를 이어서 사용
      if (k === 'transfer' && prev !== 'transfer' && accEl.value && !fromEl.value) fromEl.value = accEl.value;
      if (k !== 'transfer' && prev === 'transfer' && fromEl.value) accEl.value = fromEl.value;
      if (!t && k !== 'transfer' && prev !== 'transfer') pick(accEl, state.settings.lastAccount[k] || accEl.value);
      applyKind();
    };
    const reading = () => { const n = parseAmount(amtEl.value); $('#t-reading', root).textContent = n >= 1e4 ? koreanReading(n) : ''; };

    catsEl.addEventListener('change', e => { if (e.target.name === 'cat') cat = e.target.value; });
    $$('input[name="kind"]', root).forEach(r => r.addEventListener('change', () => setKind(r.value)));
    amtEl.addEventListener('input', () => { formatMoneyInput(amtEl); reading(); updateNote(); errEl.textContent = ''; });
    [fromEl, toEl].forEach(el => el.addEventListener('change', () => { applyKind(); }));
    accEl.addEventListener('change', updateAccHint);
    $('#t-swap', root).addEventListener('click', () => { const v = fromEl.value; fromEl.value = toEl.value; toEl.value = v; applyKind(); });
    suggestEl.addEventListener('click', e => {
      const b = e.target.closest('button[data-fill]');
      if (!b) return;
      amtEl.value = fmt(Number(b.dataset.fill));
      reading(); updateNote(); errEl.textContent = '';
    });
    root.querySelector('.quick').addEventListener('click', e => {
      const b = e.target.closest('button[data-add]');
      if (!b) return;
      const add = Number(b.dataset.add);
      amtEl.value = add ? fmt(Math.min(parseAmount(amtEl.value) + add, MAX_AMOUNT)) : '';
      reading(); updateNote(); errEl.textContent = '';
    });
    applyKind();
    reading();
    // 작성 중이던 기록 이어서 쓰기
    if (dv) {
      if (KINDS.includes(dv.kind)) { kind = dv.kind; const r = root.querySelector(`input[name="kind"][value="${kind}"]`); if (r) r.checked = true; }
      amtEl.value = dv.amount || ''; cat = dv.cat || cat; dateEl.value = dv.date || dateEl.value; memoEl.value = dv.memo || '';
      pick(accEl, dv.account); pick(fromEl, dv.from); pick(toEl, dv.to);
      applyKind(); reading();
    }
    // 쓰는 동안 임시 저장 (알림이 와서 앱이 다시 열려도 잃지 않게)
    const snapshot = () => { if (draftCtl.on) saveDraft({ id: t ? t.id : '', inboxId: preset.inboxId || '', smsHash: preset.smsHash || '', kind, amount: amtEl.value, cat,
      account: accEl.value, from: fromEl.value, to: toEl.value, date: dateEl.value, memo: memoEl.value }); };
    draftCtl.on = true;
    const scheduleDraft = () => { if (!draftCtl.on) return; clearTimeout(draftCtl.timer); draftCtl.timer = setTimeout(snapshot, 250); };
    root.addEventListener('input', scheduleDraft);
    root.addEventListener('change', scheduleDraft);
    if (!t && parseAmount(amtEl.value) > 0) snapshot();        // 문자·알림으로 채워진 창은 열리자마자
    if (!t) setTimeout(() => amtEl.focus({ preventScroll: true }), 300);   // 열리는 애니메이션 중 스크롤이 튀지 않게

    $('#tx-form', root).addEventListener('submit', e => {
      clearTimeout(draftCtl.timer);
      e.preventDefault();
      const amount = parseAmount(amtEl.value);
      if (!amount) { errEl.textContent = '금액을 입력해 주세요.'; amtEl.focus(); return; }
      const date = dateEl.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { errEl.textContent = '날짜를 선택해 주세요.'; dateEl.focus(); return; }
      let accountId = '', toAccountId = '';
      if (kind === 'transfer') {
        accountId = fromEl.value; toAccountId = toEl.value;
        if (!accountId || !toAccountId) {
          errEl.textContent = state.assets.length >= 2 ? '보내는 곳과 받는 곳을 모두 골라 주세요.' : '자산 탭에 계좌를 2개 이상 등록해야 이체할 수 있어요.';
          return;
        }
        if (accountId === toAccountId) { errEl.textContent = '보내는 곳과 받는 곳이 같아요.'; return; }
      } else {
        accountId = accEl.value;
      }
      const category = kind === 'transfer' ? 'transfer' : cat;
      const memo = memoEl.value.trim();
      const now = Date.now();
      if (t) {
        if (t.accountId !== accountId) t.appliedAt = now;                // 계좌를 바꾸면 새 계좌에 반영
        if ((t.toAccountId || '') !== toAccountId) t.toAppliedAt = now;
        Object.assign(t, { kind, amount, category, date, accountId, toAccountId, memo, updatedAt: now });
        if (kind !== 'transfer') t.toAppliedAt = 0;
      } else {
        state.txs.push({
          id: newId(), kind, amount, category, date, accountId, toAccountId, memo,
          createdAt: now, updatedAt: now, appliedAt: now, toAppliedAt: kind === 'transfer' ? now : 0, src: '',
        });
      }
      const savedId = t ? t.id : state.txs[state.txs.length - 1].id;
      if (preset.inboxId) inboxFinish(preset.inboxId, 'done', savedId, `${kind === 'income' ? '수입' : kind === 'transfer' ? '이체' : '지출'} ${won(amount)} 기록함`);
      if (kind === 'transfer') {
        state.settings.lastAccount.transferFrom = accountId;
        state.settings.lastAccount.transferTo = toAccountId;
      } else {
        state.settings.lastAccount[kind] = accountId;
      }
      if (preset.smsHash) {                                   // 문자에서 가져온 기록이면 '기록한 문자'로 기억
        const seen = state.settings.smsSeen;
        if (!seen.includes(preset.smsHash)) seen.push(preset.smsHash);
        if (seen.length > 300) seen.splice(0, seen.length - 300);
      }
      saveState(); clearDraft(); closeLayers(1);
      if (preset.inboxId && inboxPending().length) {           // 알림함에서 왔으면 다음 알림을 이어서 처리
        setTimeout(() => openInbox(), 350);
        render();
      } else if (preset.smsHash && !t) {                       // 문자로 기록했으면 그 달 가계부를 보여줌
        ui.month = date.slice(0, 7); ui.ledgerMode = 'month'; setTab('ledger');
      } else {
        if (ui.tab === 'ledger' || ui.tab === 'cards') ui.month = date.slice(0, 7);
        render();
      }
      const accA = assetById(accountId), toA = assetById(toAccountId);
      if (t) toast('저장했어요');
      else if (kind === 'transfer' && isCard(toA)) toast(`${toA.name} 카드값 ${won(amount)} 결제했어요`);
      else if (kind === 'transfer') { const to = accName(toAccountId); toast(`${accName(accountId)}에서 ${to}${josaRo(to)} ${won(amount)} 이체했어요`); }
      else if (kind === 'expense' && isCard(accA)) toast(`${accA.name}${josaRo(accA.name)} ${won(amount)} 결제 기록했어요`);
      else toast(`${kind === 'income' ? '수입' : '지출'} ${won(amount)} 기록했어요`);
    });

    const del = root.querySelector('[data-role="delete"]');
    if (del) del.addEventListener('click', async () => {
      const ok = await confirmDialog({ title: '이 기록을 삭제할까요?', message: '삭제하면 되돌릴 수 없어요.', ok: '삭제', danger: true });
      if (!ok) return;
      state.txs = state.txs.filter(x => x.id !== t.id);
      saveState(); clearDraft(); closeLayers(1); render(); toast('삭제했어요');
    });
  }, opts);
}

/* =========================================================
   8-2) 문자로 기록 (v1.4): 붙여넣기 화면 · 공유/자동화 앱에서 들어온 문자
   ========================================================= */
// 자동화 앱·공유로 열린 기록 남기기 (설정 → '최근 받은 알림'에서 확인·복사)
function logIncoming(entry, result) {
  if (!entry) return;
  entry.result = result;
  if (!state.settings.inLog.includes(entry)) state.settings.inLog.push(entry);
  if (state.settings.inLog.length > 10) state.settings.inLog.splice(0, state.settings.inLog.length - 10);
  saveState();
}
// 공유로 들어온 문자·알림 → 읽어서 (확실하면 바로 기록 / 아니면) 입력창 열기. 못 읽으면 붙여넣기 화면에 이유 표시
function handleIncoming(text, opts = {}) {
  const p = parseSms(text, { app: opts.app });
  if (!p.ok) { logIncoming(opts.log, '못 읽음: ' + p.reason); openSmsPaste(text, { error: p.reason }); return; }
  if (state.settings.smsAuto) {
    const r = autoRecord(p);
    if (r) { logIncoming(opts.log, r.dup ? '이미 기록한 알림' : '바로 기록: ' + r.msg); afterAutoRecord(r); return; }
  }
  logIncoming(opts.log, '입력창 열림 (' + (p.kind === 'income' ? '수입' : '지출') + ' ' + fmt(p.amount) + '원)');
  openTxForm(null, { preset: smsToPreset(p) });
}
const normName = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function showLedgerFor(date) {
  ui.month = date.slice(0, 7); ui.ledgerMode = 'month'; setTab('ledger');
}
// 내 계좌 사이에서 돈을 옮기면 '출금' 알림과 '입금' 알림이 하나씩 와요 → 같은 금액·반대 방향·다른 계좌면 하나의 이체로 합침
function findAutoMate(p, acc) {
  const now = Date.now(), nm = normName(p.memo), opp = p.kind === 'expense' ? 'income' : 'expense';
  return state.txs.find(t => t.src === 'auto' && t.amount === p.amount && t.accountId !== acc.id && t.toAccountId !== acc.id && (
    (t.kind === 'transfer' && now - t.createdAt < 86400000 && (p.kind === 'expense' ? !t.accountId : !t.toAccountId)) ||   // 상대 계좌를 기다리던 이체 (24시간)
    (t.kind === opp && now - t.createdAt < 1800000 && !!nm && normName(t.memo) === nm)));                                 // 같은 이름·반대 방향 (30분)
}
// 확실하면 바로 기록: 계좌(카드)가 하나로 정해지고 금액이 있을 때만. 기록했으면 { tx, msg }, 이미 기록한 알림이면 { dup }, 못 하면 null
function autoRecord(p) {
  const cands = smsMatchAccounts(p);
  if (cands.length !== 1 || !(p.amount > 0)) return null;
  const acc = cands[0], now = Date.now();
  if (state.settings.smsSeen.includes(p.hash)) return { dup: true, msg: '이미 기록한 알림이에요' };
  const mine = !!state.settings.myName && normName(p.memo).includes(normName(state.settings.myName));
  const mate = findAutoMate(p, acc);
  let tx, msg;
  if (mate) {                                                     // 반대쪽 알림이 먼저 와 있었음 → 하나의 이체로
    if (mate.kind === 'income') { mate.toAccountId = mate.accountId; mate.toAppliedAt = mate.appliedAt; mate.accountId = acc.id; mate.appliedAt = now; }
    else if (mate.kind === 'expense') { mate.toAccountId = acc.id; mate.toAppliedAt = now; }
    else if (p.kind === 'expense') { mate.accountId = acc.id; mate.appliedAt = now; }
    else { mate.toAccountId = acc.id; mate.toAppliedAt = now; }
    Object.assign(mate, { kind: 'transfer', category: 'transfer', memo: '내 계좌 간 이체', updatedAt: now });
    tx = mate;
    msg = `이체로 합쳤어요: ${accName(tx.accountId)} → ${accName(tx.toAccountId)} ${won(tx.amount)}`;
  } else {
    const preset = smsToPreset(p);                                // 카드값·적금 같은 이체 제안 포함
    const isX = preset.kind === 'transfer';
    tx = { id: newId(), kind: isX || mine ? 'transfer' : p.kind, date: p.date, amount: p.amount, src: 'auto',
      category: isX || mine ? 'transfer' : p.category, memo: mine ? '내 계좌 간 이체' : (p.memo || `${p.brand} 알림`.trim()),
      accountId: '', toAccountId: '', createdAt: now, updatedAt: now, appliedAt: 0, toAppliedAt: 0 };
    if (isX) { tx.accountId = preset.from; tx.toAccountId = preset.to; tx.appliedAt = now; tx.toAppliedAt = now; }
    else if (mine) { if (p.kind === 'expense') { tx.accountId = acc.id; tx.appliedAt = now; } else { tx.toAccountId = acc.id; tx.toAppliedAt = now; } }
    else { tx.accountId = acc.id; tx.appliedAt = now; }
    state.txs.push(tx);
    msg = isX ? `${accName(tx.accountId)} → ${accName(tx.toAccountId)} ${won(p.amount)} 이체 기록했어요`
      : mine ? `${acc.name} ${p.kind === 'expense' ? '출금' : '입금'} ${won(p.amount)} — 내 계좌 간 이체로 두고 상대 계좌 알림을 기다려요`
      : `${acc.name} ${p.kind === 'income' ? '수입' : '지출'} ${won(p.amount)}${p.memo ? ' · ' + p.memo : ''} 기록했어요`;
  }
  const seen = state.settings.smsSeen;
  seen.push(p.hash); if (seen.length > 300) seen.splice(0, seen.length - 300);
  saveState();
  return { tx, msg, hash: p.hash };
}
// 바로 기록한 뒤: 그 달 가계부로 가서 배너(고치기·지우기) + 알림
function afterAutoRecord(r) {
  if (r.dup) { ui.lastAuto = null; render(); toast(r.msg); return; }
  ui.lastAuto = { id: r.tx.id, hash: r.hash, text: r.msg };
  showLedgerFor(r.tx.date);
  toast('📩 ' + r.msg);
}

/* ---------------------------------------------------------
   받은 알림함 (v1.6): 자동화 앱이 넘겨준 알림은 먼저 여기에 담아 두고,
   확실한 것만 바로 기록해요. 나머지는 나중에 한 번에 처리해요.
   (알림이 연달아 와도 앞의 알림이 사라지지 않아요)
   --------------------------------------------------------- */
const inboxPending = () => state.inbox.filter(x => x.status === 'pending');
const inboxItem = id => state.inbox.find(x => x.id === id);
// 알림 하나 도착: 담아 두기 → (설정이 켜져 있고 확실하면) 바로 기록
function inboxArrive(app, text, log) {
  const p = parseSms(text, { app });
  const hash = p.ok ? p.hash : smsHash(app + text);
  if (state.inbox.some(x => x.hash === hash)) { logIncoming(log, '이미 받은 알림'); render(); toast('이미 받은 알림이에요'); return; }
  const item = { id: newId(), at: Date.now(), app, text, hash, status: 'pending', txId: '', note: p.ok ? '' : p.reason };
  state.inbox.push(item);
  if (state.inbox.length > 200) state.inbox.splice(0, state.inbox.length - 200);
  if (p.ok && state.settings.smsAuto) {
    const r = autoRecord(p);
    if (r && !r.dup) {
      item.status = 'done'; item.txId = r.tx.id; item.note = r.msg;
      saveState(); logIncoming(log, '바로 기록: ' + r.msg); afterAutoRecord(r); return;
    }
    if (r && r.dup) { item.status = 'skipped'; item.note = '이미 기록한 알림'; saveState(); logIncoming(log, '이미 기록한 알림'); render(); toast(r.msg); return; }
  }
  saveState();
  logIncoming(log, p.ok ? `알림함에 담음 (${p.kind === 'income' ? '수입' : '지출'} ${fmt(p.amount)}원)` : '알림함에 담음 (못 읽음: ' + p.reason + ')');
  render();
  toast(`📩 알림을 받아 두었어요 · 확인할 알림 ${inboxPending().length}건`);
}
// 알림함 항목 하나의 요약 (읽을 때마다 새로 읽어서 형식이 좋아지면 바로 반영)
function inboxSummary(x) {
  const p = parseSms(x.text, { app: x.app });
  if (!p.ok) return { p, text: '못 읽음: ' + p.reason, sure: false };
  const cands = smsMatchAccounts(p);
  const acc = cands[0] ? cands[0].name + (cands.length > 1 ? ` 외 ${cands.length - 1}개` : '') : '계좌 모름';
  return { p, sure: cands.length === 1, text: `${p.kind === 'income' ? '수입' : '지출'} ${won(p.amount)}${p.memo ? ' · ' + p.memo : ''} · ${acc}` };
}
function inboxItemRow(x) {
  const sm = inboxSummary(x);
  return `<li class="inbox-item" data-id="${esc(x.id)}">
    <div class="ib-head"><b>${esc(x.app || '알림')}</b><span>${esc(stampLabel(x.at))}</span></div>
    <div class="ib-sum${sm.p.ok ? '' : ' muted'}">${esc(sm.text)}</div>
    <div class="ib-text">${esc(x.text.replace(/\s+/g, ' ').slice(0, 100))}</div>
    <div class="btn-row"><button class="btn small primary" type="button" data-action="inbox-record" data-id="${esc(x.id)}">${sm.p.ok ? '기록' : '내용 보고 기록'}</button>
      <button class="btn small" type="button" data-action="inbox-skip" data-id="${esc(x.id)}">건너뛰기</button></div>
  </li>`;
}
function openInbox(opts = {}) {
  const pending = inboxPending();
  const sure = pending.filter(x => inboxSummary(x).sure).length;
  const done = state.inbox.filter(x => x.status !== 'pending');
  const html = `<div class="detail">
    ${pending.length ? `<p class="desc">확인할 알림 <b>${pending.length}건</b>이에요. 하나씩 [기록]을 누르면 채워진 입력창이 열려요.</p>
      ${sure ? `<div class="btn-col"><button class="btn primary block" type="button" data-action="inbox-record-all">확실한 알림 ${sure}건 한 번에 기록</button></div>` : ''}
      <ul class="inbox" id="inbox-list">${pending.map(inboxItemRow).join('')}</ul>`
      : '<section class="empty" id="inbox-empty"><div class="big" aria-hidden="true">📭</div><h2>확인할 알림이 없어요</h2><p>자동화 앱이 넘겨준 알림이 여기에 쌓여요.</p></section>'}
    ${done.length ? `<details class="inbox-done" id="inbox-done"><summary>처리한 알림 ${done.length}건</summary>
      <ul class="inbox small">${[...done].reverse().slice(0, 50).map(x => `<li class="inbox-item"><div class="ib-head"><b>${esc(x.app || '알림')}</b><span>${esc(stampLabel(x.at))}</span></div>
        <div class="ib-sum muted">${esc(x.status === 'done' ? (x.note || '기록함') : '건너뜀' + (x.note ? ' · ' + x.note : ''))}</div></li>`).join('')}</ul>
      <button class="btn small" type="button" data-action="inbox-clear-done">처리한 알림 비우기</button></details>` : ''}
    <div class="sheet-end"></div>
  </div>`;
  openSheet('받은 알림함', html, null, opts);
}
// 알림함에서 [기록]: 읽은 내용으로 입력창 열기 (같은 창에서 바꿔 열기)
function inboxRecord(id) {
  const x = inboxItem(id);
  if (!x) return;
  const p = parseSms(x.text, { app: x.app });
  if (!p.ok) { openSmsPaste(x.text, { replace: true, error: p.reason, inboxId: x.id, app: x.app }); return; }
  openTxForm(null, { replace: true, preset: { ...smsToPreset(p), inboxId: x.id } });
}
// 알림함 항목 처리 끝 (기록함 / 건너뜀)
function inboxFinish(id, status, txId = '', note = '') {
  const x = inboxItem(id);
  if (!x) return;
  Object.assign(x, { status, txId, note });
  saveState();
}
// 확실한 알림들 한 번에 기록 (온 순서대로 → 출금·입금 짝도 맞춰짐)
function inboxRecordAll() {
  let n = 0, last = null;
  for (const x of inboxPending()) {
    const p = parseSms(x.text, { app: x.app });
    if (!p.ok) continue;
    const r = autoRecord(p);
    if (!r) continue;
    if (r.dup) { Object.assign(x, { status: 'skipped', note: '이미 기록한 알림' }); continue; }
    Object.assign(x, { status: 'done', txId: r.tx.id, note: r.msg }); n++; last = r;
  }
  saveState();
  if (!n) { toast('바로 기록할 수 있는 알림이 없어요'); return; }
  closeLayers(1);
  ui.lastAuto = { id: last.tx.id, hash: last.hash, text: n > 1 ? `${n}건 기록했어요 · 마지막: ${last.msg}` : last.msg };
  showLedgerFor(last.tx.date);
  toast(`📩 알림 ${n}건을 기록했어요`);
}
// 홈·가계부 위 카드: 확인할 알림이 있으면

const draftCtl = { on: false, timer: 0 };      // 입력창이 열려 있는 동안만 임시 저장 (닫은 뒤 blur로 생기는 change 이벤트는 무시)
function saveDraft(d) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ ...d, at: Date.now() })); } catch (e) { /* 무시 */ } }
function clearDraft() {
  draftCtl.on = false; clearTimeout(draftCtl.timer);
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ }

}
function loadDraft() {

  } catch (e) { return null; }
}
function draftBanner() {

function openSmsPaste(text = '', opts = {}) {
  const html = `<div class="form">
    <p class="desc">은행·카드 문자나 앱 알림을 붙여넣으면 금액·날짜·내용을 읽어서 입력창에 채워 드려요. 기록은 입력창에서 확인한 뒤에 돼요.</p>
    <div class="field">
      <label class="label" for="sms-text">문자·알림 내용 <span class="opt">(은행 이름이 없으면 맨 앞에 적어 주세요)</span></label>
      <textarea class="input" id="sms-text" rows="6" placeholder="예) [신한은행]11/03 00:28 [110-***-1234] 출금 23,000원 (김수연)">${esc(text)}</textarea>
      <div class="btn-row">
        <button class="btn small" type="button" data-role="clip">클립보드에서 붙여넣기</button>
        <button class="btn small primary" type="button" data-role="read">읽기</button>
      </div>
    </div>
    <div id="sms-result"></div>
    <p class="error" id="sms-error">${esc(opts.error || '')}</p>
    <p class="hint">못 읽는 문자가 있으면 그 문자를 복사해 두세요. 형식을 추가하면 읽을 수 있어요.</p>
    <div class="form-actions"><button class="btn primary grow" type="button" id="sms-go" disabled>입력창 열기</button></div>
  </div>`;
  openSheet('문자로 기록', html, root => {
    const ta = $('#sms-text', root), out = $('#sms-result', root), err = $('#sms-error', root), go = $('#sms-go', root);
    let parsed = null;
    const read = () => {
      parsed = parseSms(ta.value, { app: opts.app });
      if (parsed.ok) { out.innerHTML = smsPreview(parsed); err.textContent = ''; go.disabled = false; }
      else { out.innerHTML = ''; err.textContent = parsed.reason; go.disabled = true; }
    };
    root.querySelector('[data-role="read"]').addEventListener('click', read);
    root.querySelector('[data-role="clip"]').addEventListener('click', async () => {
      try {
        const s = await navigator.clipboard.readText();
        if (!s) { toast('클립보드가 비어 있어요'); return; }
        ta.value = s; read();
      } catch (e) { toast('붙여넣기를 허용하지 않았어요. 입력칸을 길게 눌러 붙여넣어 주세요.'); ta.focus(); }
    });
    ta.addEventListener('input', () => { go.disabled = true; err.textContent = ''; });
    go.addEventListener('click', () => { if (parsed && parsed.ok) openTxForm(null, { replace: true, preset: { ...smsToPreset(parsed), inboxId: opts.inboxId || '' } }); });
    if (ta.value.trim()) read();
    else setTimeout(() => ta.focus({ preventScroll: true }), 300);
  }, opts);
}
// 공유(문자 → 공유 → 내 자산관리)나 자동화 앱이 주소에 문자·알림 내용을 실어 열었을 때
//   문자: ?sms=내용   알림: ?app=앱이름&title=제목&text=내용   공유: ?title=&text=
function receiveShared() {
  if (!location.search) return;
  const q = new URLSearchParams(location.search);
  const app = (q.get('app') || '').trim();
  const parts = ['title', 'text', 'sms'].map(k => (q.get(k) || '').trim()).filter(Boolean).filter(s => s !== app);
  history.replaceState(history.state, '', location.pathname + location.hash);   // 새로고침해도 다시 뜨지 않게
  // 진단 기록: 무엇이 들어왔는지 (내용은 앞부분만)
  const entry = { at: Date.now(), q: [...q.entries()].map(([k, v]) => `${k}=${v.replace(/\s+/g, ' ').slice(0, 120)}`).join(' | ').slice(0, 400), result: '' };
  // 공유할 때 제목이 본문의 첫 줄과 같으면 한 번만 (알림 제목 '출금'처럼 본문 안에 들어 있는 짧은 말은 그대로 둠)
  const text = parts.filter((s, i) => !parts.some((o, j) => j !== i && o.length > s.length && o.split('\n').some(l => l.trim() === s))).join('\n');
  const keys = [...q.keys()];
  let problem = '';
  if (!text) {
    problem = `자동화 앱이 내용 없이 앱을 열었어요 (받은 항목: ${keys.length ? keys.join(', ') : '없음'}). ` +
      (keys.includes('sms') && !keys.includes('text') ? "알림 트리거에 '문자(SMS)용' 주소를 쓰면 내용이 비어서 와요. 설정의 '앱 알림용' 주소를 써 주세요."
        : 'MacroDroid 액션의 주소에서 { } 부분이 알림 내용으로 바뀌는지 확인해 주세요 (주소 칸 옆 … 버튼으로 알림 제목·알림 텍스트를 넣기).');
  } else if (/\{(not_title|notification|not_app_name|not_text|sms_message)\}/.test(app + ' ' + text)) {
    problem = '주소의 { } 부분이 알림 내용으로 바뀌지 않고 그대로 왔어요. MacroDroid 주소 칸에서 … (매직 텍스트) 버튼으로 알림 제목·알림 텍스트·앱 이름을 다시 넣어 주세요.';
  }
  if (problem) {
    logIncoming(entry, '빈 내용/그대로 옴');
    ui.lastAuto = { reason: problem, setup: true };
    render(); toast('자동화 앱 설정을 확인해 주세요');
    return;
  }
  // 자동화 앱(알림·문자)에서 온 것은 알림함에 담고, 직접 공유한 것은 바로 입력창
  const automated = keys.includes('app') || keys.includes('sms');
  setTimeout(() => (automated ? inboxArrive(app, text, entry) : handleIncoming(text, { app, log: entry })), 60);
}

/* =========================================================
   9) 백업 · 불러오기 · 전체 삭제 · 앱 설치
   ========================================================= */
function backupJSON() {
  return JSON.stringify({ app: 'my-asset', appVersion: APP_VERSION, exportedAt: new Date().toISOString(), data: state }, null, 2);
}
function backupName(ext) {
  const d = new Date();
  return `my-asset-backup-${ymd(d)}-${pad2(d.getHours())}${pad2(d.getMinutes())}.${ext}`;
}
function markBackup() {
  state.settings.lastBackupAt = Date.now();
  saveState();
  if (ui.tab === 'settings') render();
}
function exportBackup() {
  const url = URL.createObjectURL(new Blob([backupJSON()], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = backupName('json');
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  markBackup();
  toast('백업 파일을 다운로드 폴더에 저장했어요');
}
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'test.txt', { type: 'text/plain' })] })); }
  catch (e) { return false; }
}
async function shareBackup() {
  const json = backupJSON();
  let file = new File([json], backupName('json'), { type: 'application/json' });
  if (!navigator.canShare({ files: [file] })) file = new File([json], backupName('txt'), { type: 'text/plain' });
  try {
    await navigator.share({ files: [file], title: '내 자산관리 백업' });
    markBackup();
    toast('백업 파일을 보냈어요');
  } catch (e) {
    if (!e || e.name !== 'AbortError') toast('보내지 못했어요. [백업 파일 저장]을 이용해 주세요.');
  }
}
async function importBackup(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); }
  catch (e) { toast('백업 파일을 읽을 수 없어요'); return; }
  const src = obj && obj.data ? obj.data : obj;
  if (!src || !Array.isArray(src.assets) || !Array.isArray(src.txs)) { toast('내 자산관리 백업 파일이 아니에요'); return; }
  const next = normalize(src);
  const ok = await confirmDialog({
    title: '백업을 불러올까요?',
    message: `자산 ${next.assets.length}개, 가계부 ${next.txs.length}건이 들어 있어요.\n지금 데이터는 모두 이 내용으로 바뀌어요.`,
    ok: '불러오기',
  });
  if (!ok) return;
  state = next;
  saveState(); render(); toast('백업을 불러왔어요');
}
async function resetAll() {
  const ok = await confirmDialog({ title: '모든 데이터를 삭제할까요?', message: '자산과 가계부 기록이 모두 지워지고 되돌릴 수 없어요.', ok: '모두 삭제', danger: true });
  if (!ok) return;
  state = emptyState();
  saveState(); render(); toast('모든 데이터를 삭제했어요');
}

let installEvt = null;   // 크롬이 '설치 가능'하다고 알려줄 때 받는 값
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; render(); });
window.addEventListener('appinstalled', () => { installEvt = null; render(); toast('홈 화면에 설치했어요'); });
async function doInstall() {

/* =========================================================
   10) 버튼 눌림 처리 · 시작

function setTab(tab) {
  ui.tab = TABS.includes(tab) ? tab : 'home';
  ui.seg = null;
  history.replaceState(history.state, '', '#' + ui.tab);
  render();
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'tab': ui.lastAuto = null; setTab(el.dataset.tab); break;
    case 'auto-undo': {                                       // 방금 자동 기록한 것 지우기 (같은 알림이 다시 오면 또 기록되게 표시·알림함 항목도 지움)
      state.txs = state.txs.filter(x => x.id !== id);
      state.inbox = state.inbox.filter(x => x.txId !== id);
      if (ui.lastAuto && ui.lastAuto.hash) state.settings.smsSeen = state.settings.smsSeen.filter(h => h !== ui.lastAuto.hash);
      ui.lastAuto = null; saveState(); render(); toast('지웠어요');
      break;
    }
    case 'auto-dismiss': ui.lastAuto = null; render(); break;
    case 'inbox-open': openInbox(); break;
    case 'inbox-record': inboxRecord(id); break;
    case 'inbox-skip': inboxFinish(id, 'skipped'); openInbox({ replace: true }); toast('건너뛰었어요'); break;
    case 'inbox-record-all': inboxRecordAll(); break;
    case 'inbox-clear-done': state.inbox = state.inbox.filter(x => x.status === 'pending'); saveState(); openInbox({ replace: true }); break;
    case 'draft-resume': { const d = ui.draft; clearDraft(); render(); if (d) openTxForm(d.id || null, { draft: d }); break; }
    case 'draft-discard': clearDraft(); render(); toast('작성 중이던 기록을 버렸어요'); break;
    case 'copy-inlog': {
      const txt = state.settings.inLog.map(e => `${stampLabel(e.at)} · ${e.result}\n${e.q}`).join('\n\n');
      navigator.clipboard.writeText(txt).then(() => toast('기록을 복사했어요'), () => toast('복사하지 못했어요'));
      break;
    }
    case 'new-asset': openAssetForm(); break;
    case 'view-asset': openAssetDetail(id); break;
    case 'edit-asset': openAssetForm(id); break;
    case 'new-tx': openTxForm(); break;
    case 'new-card': openAssetForm(null, { presetType: 'card' }); break;
    case 'new-card-tx': {
      const last = assetById(state.settings.lastAccount.expense);
      openTxForm(null, { preset: { kind: 'expense', account: isCard(last) ? last.id : (cards()[0] || {}).id } });
      break;
    }
    case 'card-spend': openTxForm(null, { preset: { kind: 'expense', account: id } }); break;
    case 'pay-card': openCardPay(id); break;
    case 'edit-tx': openTxForm(id); break;
    case 'edit-tx-sheet': openTxForm(id, { replace: true }); break;
    case 'ledger-mode': ui.ledgerMode = id === 'period' ? 'period' : 'month'; render(); window.scrollTo(0, 0); break;
    case 'period-from-month': ui.period = { start: ui.month, end: ui.month, preset: ui.month === thisMonth() ? 'this' : '' }; ui.ledgerMode = 'period'; render(); window.scrollTo(0, 0); break;
    case 'period-preset': ui.period = presetRange(id); render(); break;
    case 'cat-stats': openCatStats(el.dataset.kind, id); break;
    case 'month-prev': ui.month = shiftMonth(ui.month, -1); render(); break;
    case 'month-next': ui.month = shiftMonth(ui.month, 1); render(); break;
    case 'month-now': ui.month = thisMonth(); render(); break;
    case 'seg': ui.seg = ui.seg === id ? null : id; render(); break;
    case 'toggle-mask':
      state.settings.hideAmounts = !state.settings.hideAmounts;
      saveState(); render();
      toast(state.settings.hideAmounts ? '금액을 숨겼어요' : '금액을 다시 보여줘요');
      break;
    case 'sms-paste': openSmsPaste(); break;
    case 'copy-url':
      navigator.clipboard.writeText(smsUrl(id)).then(() => toast('주소를 복사했어요'), () => toast('복사하지 못했어요. 길게 눌러 복사해 주세요.'));
      break;
    case 'export': exportBackup(); break;
    case 'share': shareBackup(); break;
    case 'import': $('#file-import').click(); break;
    case 'reset': resetAll(); break;
    case 'install': doInstall(); break;
    case 'close-layer': closeLayers(1); break;
  }
});

  if (id === 'my-name') { state.settings.myName = e.target.value.trim().slice(0, 30); saveState(); toast(state.settings.myName ? `내 이름: ${state.settings.myName}` : '내 이름을 지웠어요'); }
});
// 기간 통계: 시작 월 · 끝 월 바꾸기 (최대 12개월, 거꾸로 고르면 자동으로 바로잡음)
document.addEventListener('change', e => {
  const id = e.target && e.target.id;
  if (id !== 'p-start' && id !== 'p-end') return;
  let { start, end } = ui.period;
  if (id === 'p-start') start = e.target.value; else end = e.target.value;
  if (start > end) [start, end] = [end, start];
  if (monthsBetween(start, end).length > MAX_MONTHS) {
    if (id === 'p-start') end = shiftMonth(start, MAX_MONTHS - 1); else start = shiftMonth(end, -(MAX_MONTHS - 1));
    toast('기간은 최대 12개월까지 볼 수 있어요');
  }
  ui.period = { start, end, preset: '' };
  render();
});
$('#file-import').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) importBackup(f);
});
// 다른 창에서 데이터가 바뀌면 다시 읽기
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY && !layers.length) { state = loadState(); render(); } });
// 앱으로 돌아왔을 때 날짜(오늘·이번 달) 새로 반영
// 그사이 달이 바뀌었으면: 보고 있던 달이 '이번 달'이었으면 새 달로, 빠른 선택(이번 달·최근 3개월 등) 기간도 새 달 기준으로
let seenMonth = thisMonth();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || layers.length) return;
  const cur = thisMonth();
  if (cur !== seenMonth) {
    if (ui.month === seenMonth) ui.month = cur;
    if (ui.period.preset) ui.period = presetRange(ui.period.preset);
    seenMonth = cur;
  }
  render();
});

let state = loadState();
const ui = {
  tab: TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home',
  month: thisMonth(), seg: null,
  ledgerMode: 'month',                 // 가계부: 'month'(월별 내역) | 'period'(기간 통계)
  period: presetRange('this'),         // 기간 통계에서 고른 기간
  lastAuto: null,                      // 방금 알림으로 자동 기록한 것 (가계부 위 배너: 고치기·지우기)
  draft: null,                         // 알림 도착으로 닫혀 버린, 작성 중이던 입력창 내용
};
ui.draft = loadDraft();
if (history.state && history.state.myassetLayer) history.replaceState(null, '', location.href);
render();
requestPersist();
receiveShared();                          // 문자 공유·자동화 앱으로 열렸으면 입력창 채우기
window.myassetParseSms = parseSms;        // 문자 읽기 확인용 (테스트)

// 오프라인에서도 열리도록 서비스워커 등록 (인터넷 주소로 열었을 때만)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => { /* 무시 */ }); });
}
})();
</script>
</body>
</html>
