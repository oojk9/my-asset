<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>내 자산관리</title>
<meta name="description" content="예금·적금·투자·부동산·대출과 매일의 가계부를 한눈에 관리하는 개인용 앱">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* =========================================================
   1) 색상 · 글꼴 (휴대폰 설정에 따라 라이트/다크 모드 자동)
   ========================================================= */
:root {
  color-scheme: light;
  --bg: #f2f2ef;          /* 화면 바탕 */
  --card: #ffffff;        /* 카드 바탕 */
  --card-2: #f4f4f1;      /* 입력칸 · 칩 바탕 */
  --ink: #141413;         /* 기본 글자 */
  --ink-2: #52514e;       /* 보조 글자 */
  --muted: #6f6d68;       /* 흐린 글자 */
  --line: #e6e5df;        /* 구분선 */
  --accent: #256abf;      /* 버튼 등 강조색 */
  --accent-ink: #1c5cab;  /* 강조 글자색 */
  --accent-soft: #e6f0fb; /* 강조 연한 바탕 */
  --income: #1c5cab;      /* 수입 금액 글자색 */
  --danger: #c93434;      /* 삭제 글자색 */
  --danger-btn: #c93434;  /* 삭제 버튼 바탕 */
  --danger-soft: #fcebeb;
  --warn-soft: #fff4dc;
  --overlay: rgba(10, 10, 10, .42);
  /* 자산 종류별 색 (순서 고정 · 색각이상 구분 검증된 팔레트) */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --bar: #2a78d6;         /* 분류별 지출 막대 */
  --tabbar-h: 62px;
  --radius: 20px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e0e0d;
    --card: #1c1c1b;
    --card-2: #272725;
    --ink: #f4f4f1;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --line: #30302e;
    --accent: #256abf;
    --accent-ink: #79aef0;
    --accent-soft: #1b2b40;
    --income: #79aef0;
    --danger: #f07a7a;
    --danger-btn: #c93434;
    --danger-soft: #3a1f1f;
    --warn-soft: #3a2f14;
    --overlay: rgba(0, 0, 0, .62);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --bar: #3987e5;
  }
}

/* =========================================================
   2) 기본 스타일
   ========================================================= */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2, h3 { letter-spacing: -0.01em; }

/* =========================================================
   3) 화면 뼈대 (상단바 · 본문 · 하단 탭 · + 버튼)
   ========================================================= */
.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 10px) 10px 8px 20px;
  background: var(--bg);
}
.topbar h1 { margin: 0; font-size: 22px; font-weight: 800; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; border-radius: 12px; background: none; color: var(--ink-2);
}
.icon-btn:active { background: var(--card-2); }
.view { padding: 4px 16px calc(var(--tabbar-h) + 100px + env(safe-area-inset-bottom)); outline: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--tabbar-h); border: 0; background: none;
  color: var(--muted); font-size: 12px; font-weight: 600;
}
.tab[aria-current="page"] { color: var(--accent-ink); }
.tab[aria-current="page"] svg { stroke-width: 2.3; }

.fab {
  position: fixed; z-index: 31;
  right: max(16px, calc((100vw - 560px) / 2 + 16px));
  bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom));
  width: 58px; height: 58px; border-radius: 50%; border: 0;
  display: grid; place-items: center;
  background: var(--accent); color: #fff;
  box-shadow: 0 6px 18px rgba(37, 106, 191, .38);
}
.fab svg { width: 28px; height: 28px; stroke-width: 2.4; }
.fab:active { transform: scale(.95); }

/* =========================================================
   4) 카드 · 목록 · 버튼
   ========================================================= */
.card { background: var(--card); border-radius: var(--radius); padding: 20px; margin: 0 0 12px; }
.card h2 { margin: 0; font-size: 17px; font-weight: 700; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.muted-s { font-size: 13px; color: var(--muted); font-weight: 500; }
.desc { margin: 8px 0 14px; color: var(--ink-2); font-size: 15px; }
.center { text-align: center; }
.link { border: 0; background: none; padding: 6px 2px; color: var(--accent-ink); font-size: 14px; font-weight: 700; }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 50px; padding: 0 18px; border: 0; border-radius: 14px;
  background: var(--card-2); color: var(--ink); font-size: 16px; font-weight: 700;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { background: var(--danger-btn); color: #fff; }
.btn.danger-ghost { background: var(--danger-soft); color: var(--danger); }
.btn.small { min-height: 40px; padding: 0 16px; font-size: 15px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn.grow { flex: 1; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }
.btn-col { display: grid; gap: 8px; margin-bottom: 12px; }

.list { list-style: none; margin: 0; padding: 0; }
.list.card { padding: 6px 0; }
.list.flush .row { padding-left: 0; padding-right: 0; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px;
  padding: 10px 20px; border: 0; background: none; text-align: left; border-radius: 0;
}
.row:active { background: var(--card-2); }
.row-icon {
  flex: none; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; background: var(--card-2); font-size: 20px; line-height: 1;
}
.row-main { flex: 1; min-width: 0; display: block; }
.row-title, .row-sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-title { font-size: 16px; font-weight: 600; }
.row-sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
.row-amt { flex: none; font-size: 16px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.income { color: var(--income); }

.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* 홈: 순자산 */
.hero-label { font-size: 15px; font-weight: 700; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hero-value { margin-top: 6px; font-size: clamp(30px, 9vw, 40px); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
.hero-value .u { font-size: .58em; font-weight: 700; margin-left: 3px; }
.hero-sub { margin-top: 4px; color: var(--ink-2); font-size: 15px; min-height: 1.5em; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.split-item {
  display: block; text-align: left; border: 0; border-radius: 14px;
  background: var(--card-2); padding: 12px 14px; min-width: 0;
}
.split-item .lbl { display: block; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.split-item .val { display: block; margin-top: 2px; font-size: 16px; font-weight: 700; }

/* 홈: 자산 구성 막대 + 범례(표) */
.stack { display: flex; gap: 2px; height: 16px; border-radius: 5px; overflow: hidden; margin: 2px 0 12px; }
.stack .seg { flex: 1 1 0; min-width: 4px; height: 100%; border: 0; padding: 0; transition: opacity .15s; }
.stack.has-active .seg:not(.active) { opacity: .3; }
.legend { list-style: none; margin: 0; padding: 0; }
.legend li {
  display: grid; grid-template-columns: 12px 1fr auto auto; align-items: center; gap: 10px;
  padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; cursor: pointer;
  transition: opacity .15s;
}
.legend li:first-child { border-top: 0; }
.legend.has-active li:not(.active) { opacity: .4; }
.legend li.active .name { font-weight: 700; }
.legend .pct { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; min-width: 50px; font-size: 14px; }
.legend .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.ratio { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); display: flex; justify-content: space-between; }
.ratio b { color: var(--ink); }

/* 수입 · 지출 합계 */
.sumrows { display: grid; gap: 8px; }
.sumrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 16px; }
.sumrow .k { color: var(--ink-2); }
.sumrow .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.sumrow.total { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.sumrow.total .k { color: var(--ink); font-weight: 600; }
.sumrow.total .v { font-size: 19px; }
.subhead { margin: 18px 0 2px; font-size: 14px; color: var(--ink-2); font-weight: 700; }

/* 가계부: 월 이동 · 분류별 막대 · 날짜별 목록 */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
.month-nav h2 { margin: 0; font-size: 19px; font-weight: 800; }
.catbars { list-style: none; margin: 0; padding: 0; }
.catbars li { padding: 7px 0; }
.cb-top { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
.cb-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-pct { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.cb-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.cb-track { height: 8px; margin-top: 5px; }
.cb-bar { display: block; height: 100%; min-width: 4px; background: var(--bar); border-radius: 0 4px 4px 0; }
.day { margin-bottom: 12px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px 4px 8px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.day-head .ds { font-variant-numeric: tabular-nums; text-align: right; }
.day-head .ds span + span { margin-left: 8px; }

/* 자산 탭 */
.mini-sum { display: grid; gap: 6px; }
.mini-sum div { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.mini-sum .lbl { color: var(--ink-2); }
.mini-sum .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.mini-sum .strong { font-size: 17px; }
.group { margin-bottom: 14px; }
.group-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 8px; }
.group-head h3 { margin: 0; flex: 1; font-size: 15px; font-weight: 700; }
.group-head .sum { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* 안내 카드 · 빈 화면 */
.notice { display: flex; align-items: center; gap: 12px; }
.notice .grow { flex: 1; }
.notice p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.notice.warn { background: var(--warn-soft); }
.notice.install { background: var(--accent-soft); }
.empty { text-align: center; padding: 32px 20px; }
.empty .big { font-size: 42px; line-height: 1; }
.empty h2 { margin-top: 12px; }
.empty p { margin: 8px 0 18px; color: var(--ink-2); }
.welcome h2 { font-size: 20px; margin-top: 6px; }
.welcome p { color: var(--ink-2); margin: 6px 0 10px; }
.welcome-emoji { font-size: 36px; line-height: 1; }
.steps { margin: 0 0 18px; padding-left: 20px; color: var(--ink-2); }
.steps li { margin: 4px 0; }
.steps b { color: var(--ink); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint.center { text-align: center; margin: 8px 0 4px; }
.kv { list-style: none; margin: 10px 0 0; padding: 0; }
.kv li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.kv li:first-child { border-top: 0; }
.kv span { color: var(--ink-2); white-space: nowrap; }
.kv b { text-align: right; }
.version { text-align: center; font-size: 13px; color: var(--muted); margin: 18px 0; }

/* =========================================================
   5) 입력 화면 (아래에서 올라오는 시트) · 확인창 · 알림
   ========================================================= */
.backdrop { position: fixed; inset: 0; z-index: 40; background: var(--overlay); opacity: 0; transition: opacity .22s; }
.backdrop.top { z-index: 60; }
.backdrop.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 560px; margin: 0 auto; max-height: calc(100dvh - 24px);
  display: flex; flex-direction: column;
  background: var(--card); border-radius: 24px 24px 0 0;
  transform: translateY(105%); transition: transform .25s ease;
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.show { transform: none; }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 4px 20px; }
.sheet-head h2 { margin: 0; font-size: 19px; font-weight: 800; }
.sheet-body { overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; padding: 8px 20px 0; }

.form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 0; padding: 0; border: 0; min-width: 0; }
.label { padding: 0; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.opt { font-weight: 500; color: var(--muted); }
.input {
  width: 100%; min-height: 50px; padding: 12px 14px; font-size: 16px;
  background: var(--card-2); border: 1.5px solid transparent; border-radius: 14px; color: var(--ink);
}
.input:focus { outline: none; border-color: var(--accent); background: var(--card); }
.input::placeholder { color: var(--muted); }
select.input {
  appearance: none; -webkit-appearance: none; padding-right: 40px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 21px) 50%, calc(100% - 15px) 50%;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
}
.money-input { display: flex; align-items: baseline; gap: 6px; min-width: 0; border-bottom: 2px solid var(--line); }
.money-input:focus-within { border-color: var(--accent); }
.input-money {
  flex: 1 1 0; width: 0; min-width: 0; border: 0; outline: none; background: transparent;
  font-size: 26px; font-weight: 800; padding: 6px 0; color: var(--ink);
}
.money-input.big .input-money { font-size: 30px; }
.input-money::placeholder { color: var(--line); }
.money-input .unit { font-size: 20px; font-weight: 700; color: var(--ink-2); }
.reading { color: var(--accent-ink); font-weight: 600; min-height: 1.4em; }
.error { margin: 0; color: var(--danger); font-size: 14px; font-weight: 700; }
.error:empty { display: none; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--ink-2);
}
.quick button:active { background: var(--card-2); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chip > span {
  display: inline-flex; align-items: center; gap: 5px; min-height: 38px; padding: 6px 12px;
  border-radius: 999px; background: var(--card-2); border: 1.5px solid transparent;
  font-size: 14.5px; color: var(--ink-2); white-space: nowrap;
}
.chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--card-2); }
.segmented label { position: relative; }
.segmented input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.segmented span { display: block; padding: 10px; border-radius: 11px; text-align: center; font-weight: 700; color: var(--muted); }
.segmented input:checked + span { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .1); }
.segmented[data-kind="income"] input:checked + span { color: var(--income); }
.segmented input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

.form-actions {
  position: sticky; bottom: 0; display: flex; gap: 8px;
  margin: 0 -20px; padding: 12px 20px 16px; background: var(--card);
  border-top: 1px solid var(--line);
}
.form-actions .btn.danger-ghost { flex: 0 0 auto; }

.dialog {
  position: fixed; z-index: 61; left: 50%; top: 50%;
  width: min(340px, calc(100% - 48px));
  transform: translate(-50%, -50%) scale(.96); opacity: 0; transition: opacity .15s, transform .15s;
  background: var(--card); border-radius: 22px; padding: 22px 20px 16px;
}
.dialog.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 800; }
.dialog p { margin: 0 0 18px; color: var(--ink-2); font-size: 15px; white-space: pre-line; }
.dialog-actions { display: flex; gap: 8px; }
.dialog-actions .btn { flex: 1; }

.toast {
  position: fixed; z-index: 80; left: 50%;
  bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom));
  width: max-content; max-width: calc(100% - 32px); transform: translate(-50%, 16px); opacity: 0;
  padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--card);
  font-size: 15px; font-weight: 600; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =========================================================
   6) 이체 · 계좌 상세 (v1.1)
   ========================================================= */
.row-amt.transfer { color: var(--ink-2); }
.sumrow.xfer { font-size: 15px; }
.sumrow.xfer .k, .sumrow.xfer .v { color: var(--ink-2); }
.sumrow.xfer .v { font-weight: 600; }
.swap-row { display: flex; justify-content: center; }
.swap-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 5px 14px; font-size: 14px; font-weight: 600;
}
.swap-btn svg { width: 18px; height: 18px; }

<script>
(() => {
'use strict';

/* =========================================================

const APP_VERSION = '1.6.0';
const DATA_VERSION = 6;                 // 데이터 구조 버전 (2: 이체, 3: 신용카드, 4: 문자 식별 단어·문자 기록 이력, 5: 자동 기록 표시·바로 기록 설정·내 이름, 6: 받은 알림함)
const STORAGE_KEY = 'myasset.v1';       // 휴대폰에 저장할 때 쓰는 이름 (기존 데이터를 그대로 읽도록 유지)
const DRAFT_KEY = STORAGE_KEY + '.draft';   // 작성 중이던 가계부 입력창 (알림 도착으로 앱이 다시 열려도 잃지 않게)
const MAX_AMOUNT = 1e15;                // 입력 가능한 최대 금액 (천조 원)

// 자산 종류: color = 차트 색 번호
const ASSET_TYPES = [
  { id: 'cash',       label: '현금·통장', kind: 'asset',     color: 1,
    hint: '현금, 입출금통장, 파킹통장, CMA', ph: '예) 국민은행 월급통장, 지갑 현금', amountLabel: '현재 잔액' },
  { id: 'deposit',    label: '예금',      kind: 'asset',     color: 2,
    hint: '정기예금, 예금 통장', ph: '예) 신한 정기예금', amountLabel: '현재 금액' },
  { id: 'savings',    label: '적금',      kind: 'asset',     color: 3,
    hint: '정기·자유적금, 주택청약', ph: '예) 카카오뱅크 자유적금', amountLabel: '지금까지 모은 금액' },
  { id: 'invest',     label: '투자',      kind: 'asset',     color: 4,
    hint: '주식, ETF, 펀드, 코인, 연금저축', ph: '예) 키움증권 주식계좌', amountLabel: '현재 평가금액' },
  { id: 'realestate', label: '부동산',    kind: 'asset',     color: 5,
    hint: '아파트·토지, 전·월세 보증금', ph: '예) 우리집 아파트, 전세보증금', amountLabel: '현재 시세 (또는 보증금)' },
  { id: 'other',      label: '기타 자산', kind: 'asset',     color: 6,
    hint: '저축성 보험, 자동차, 빌려준 돈 등', ph: '예) 저축보험, 자동차, 빌려준 돈', amountLabel: '현재 금액 (또는 모은 금액)' },
  { id: 'card',       label: '신용카드',  kind: 'liability', color: 7,
    hint: '신용카드 — 카드 앱의 결제 예정 금액을 넣으세요 (체크카드는 통장에서 바로 빠지니 통장을 고르세요)', ph: '예) 신한카드, 현대카드', amountLabel: '아직 결제 안 한 카드값' },
  { id: 'loan',       label: '대출·부채', kind: 'liability', color: 8,
    hint: '주택담보·전세·신용대출, 마이너스통장', ph: '예) 전세자금대출, 마이너스통장', amountLabel: '남은 금액' },
];

// 가계부 분류
const EXPENSE_CATS = [
  { id: 'food',      label: '식비',        icon: '🍚' },
  { id: 'cafe',      label: '카페·간식',   icon: '☕' },
  { id: 'living',    label: '생활·마트',   icon: '🛒' },
  { id: 'transport', label: '교통·차량',   icon: '🚌' },
  { id: 'housing',   label: '주거·관리비', icon: '🏠' },
  { id: 'telecom',   label: '통신',        icon: '📱' },
  { id: 'shopping',  label: '쇼핑·미용',   icon: '🛍️' },
  { id: 'health',    label: '의료·건강',   icon: '💊' },
  { id: 'culture',   label: '문화·여가',   icon: '🎬' },
  { id: 'edu',       label: '교육·육아',   icon: '📚' },
  { id: 'gift',      label: '경조사·선물', icon: '🎁' },
  { id: 'tax',       label: '보험·세금',   icon: '🧾' },
  { id: 'etc',       label: '기타 지출',   icon: '📌' },
];
const INCOME_CATS = [
  { id: 'salary',    label: '급여',        icon: '💼' },
  { id: 'bonus',     label: '상여·성과급', icon: '🎉' },
  { id: 'side',      label: '부수입',      icon: '💡' },
  { id: 'interest',  label: '이자·배당',   icon: '🏦' },
  { id: 'allowance', label: '용돈',        icon: '💌' },
  { id: 'in_etc',    label: '기타 수입',   icon: '📌' },
];
const KINDS = ['expense', 'income', 'transfer'];   // 지출 · 수입 · 이체

const TYPE = Object.fromEntries(ASSET_TYPES.map(t => [t.id, t]));
const CAT = Object.fromEntries([...EXPENSE_CATS, ...INCOME_CATS].map(c => [c.id, c]));
const catsOf = kind => (kind === 'income' ? INCOME_CATS : EXPENSE_CATS);
const TABS = ['home', 'assets', 'ledger', 'cards', 'settings'];

/* =========================================================
   1) 작은 도우미 함수들
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

// 사용자가 입력한 글자를 화면에 안전하게 넣기 (HTML 코드로 해석되지 않게)
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0, 7);
function newId() {
  try { return crypto.randomUUID(); }
  catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
}

// 1234567 → "1,234,567"
const fmt = n => Math.round(n).toLocaleString('ko-KR');

// 금액 표시: won(12000) → "12,000원", won(-12000, {sign:true}) → "−12,000원"
function won(n, opts = {}) {
  if (state.settings.hideAmounts) return '••••••원';
  const s = opts.sign ? (n > 0 ? '+' : n < 0 ? '−' : '') : (n < 0 ? '−' : '');
  return s + fmt(Math.abs(n)) + '원';
}
// 큰 글씨 금액 (홈 순자산)
function moneyBig(n) {
  if (state.settings.hideAmounts) return '••••••<span class="u">원</span>';
  return `${n < 0 ? '−' : ''}${fmt(Math.abs(n))}<span class="u">원</span>`;
}
// 정확한 한글 읽기: 123456789 → "1억 2,345만 6,789원"
function koreanReading(n) {
  let rest = Math.round(Math.abs(n));
  if (!rest) return '0원';
  const parts = [];
  for (const [unit, name] of [[1e12, '조'], [1e8, '억'], [1e4, '만']]) {
    const q = Math.floor(rest / unit);

// 받침에 따라 '로/으로' 고르기: 적금 → "적금으로", 보험 → "보험으로", 통장 → "통장으로", 카드 → "카드로"

/* =========================================================
   2) 데이터 저장 · 불러오기  (휴대폰 브라우저 저장소 localStorage)
   ---------------------------------------------------------
   assets: [{ id, type, name, memo, baseAmount, baseAt, createdAt, updatedAt }]
     · baseAmount = 마지막으로 직접 입력한 금액, baseAt = 그 시각
   txs:    [{ id, kind('expense'|'income'|'transfer'), date('YYYY-MM-DD'), amount, category,
              memo, accountId, toAccountId, createdAt, updatedAt, appliedAt, toAppliedAt }]
     · 지출/수입: accountId = 돈이 나간/들어온 계좌
     · 이체: accountId = 보내는 곳(−), toAccountId = 받는 곳(+)

function emptyState() {
  return {
    version: DATA_VERSION, assets: [], txs: [], inbox: [],
    settings: { hideAmounts: false, lastAccount: { expense: '', income: '', transferFrom: '', transferTo: '' }, lastBackupAt: 0,
      smsSeen: [], smsAuto: true, myName: '', inLog: [] },

// 저장된 값(또는 백업 파일)을 검사해서 올바른 모양으로 정리 — v1(이체 없던 버전) 데이터도 그대로 읽음
function normalize(raw) {
  const s = emptyState();
  if (!raw || typeof raw !== 'object') return s;
  const num = (v, d = 0) => (v !== null && v !== '' && Number.isFinite(Number(v)) ? Number(v) : d);
  const str = (v, max) => (v == null ? '' : String(v)).slice(0, max);
  const ids = new Set();
  const uid = v => { let id = str(v, 64); if (!id || ids.has(id)) id = newId(); ids.add(id); return id; };
  if (Array.isArray(raw.assets)) {
    for (const a of raw.assets) {
      if (!a || !TYPE[a.type]) continue;
      s.assets.push({
        id: uid(a.id), type: a.type, name: str(a.name, 60) || TYPE[a.type].label, memo: str(a.memo, 200),
        baseAmount: Math.min(Math.max(0, Math.round(num(a.baseAmount))), MAX_AMOUNT),
        baseAt: num(a.baseAt), createdAt: num(a.createdAt), updatedAt: num(a.updatedAt),
        payDay: Math.min(31, Math.max(0, Math.round(num(a.payDay)))),     // 카드 결제일 (0 = 미정)
        payAccountId: str(a.payAccountId, 64),                            // 카드값이 빠져나가는 통장
        smsKey: str(a.smsKey, 40).trim(),                                 // 문자에서 이 계좌를 알아보는 말 (v1.4, 비면 이름으로)
      });
    }
  }
  if (Array.isArray(raw.txs)) {
    for (const t of raw.txs) {
      if (!t || !KINDS.includes(t.kind)) continue;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(t.date))) continue;
      const amount = Math.min(Math.round(num(t.amount)), MAX_AMOUNT);
      if (!(amount > 0)) continue;
      const tx = {
        id: uid(t.id), kind: t.kind, date: t.date, amount, category: '', memo: str(t.memo, 200),
        accountId: str(t.accountId, 64), toAccountId: '',
        createdAt: num(t.createdAt), updatedAt: num(t.updatedAt),
        appliedAt: num(t.appliedAt, num(t.createdAt)), toAppliedAt: 0,
        src: t.src === 'auto' ? 'auto' : '',                          // 'auto' = 문자·알림으로 자동 기록됨 (v5)
      };
      if (t.kind === 'transfer') {
        tx.category = 'transfer';
        tx.toAccountId = str(t.toAccountId, 64);
        tx.toAppliedAt = num(t.toAppliedAt, tx.appliedAt);
      } else {
        const cats = catsOf(t.kind);
        tx.category = cats.some(c => c.id === t.category) ? t.category : cats[cats.length - 1].id;
      }
      s.txs.push(tx);
    }
  }
  // 받은 알림함 (v6): 자동화 앱이 넘겨준 알림을 처리 전까지 보관
  if (Array.isArray(raw.inbox)) {
    for (const x of raw.inbox) {
      if (!x || typeof x !== 'object' || !x.text) continue;
      s.inbox.push({
        id: uid(x.id), at: num(x.at), app: str(x.app, 60), text: str(x.text, 2000), hash: str(x.hash, 16),
        status: ['pending', 'done', 'skipped'].includes(x.status) ? x.status : 'pending', txId: str(x.txId, 64), note: str(x.note, 200),
      });
    }
    s.inbox = s.inbox.slice(-200);
  }

  const la = st.lastAccount || {};
  s.settings.hideAmounts = !!st.hideAmounts;
  s.settings.lastAccount = {
    expense: str(la.expense, 64), income: str(la.income, 64),
    transferFrom: str(la.transferFrom, 64), transferTo: str(la.transferTo, 64),
  };
  s.settings.lastBackupAt = num(st.lastBackupAt);
  // 이미 기록한 문자의 표시(해시) — 같은 문자를 또 넣으면 알려주기 위해 최근 300개만
  s.settings.smsSeen = (Array.isArray(st.smsSeen) ? st.smsSeen : []).filter(x => typeof x === 'string' && x.length <= 16).slice(-300);
  s.settings.smsAuto = st.smsAuto !== false;                   // 문자·알림이 확실하면 바로 기록 (기본 켬)
  s.settings.myName = str(st.myName, 30).trim();               // 내 이름 (내 계좌 간 이체 알아보기)
  // 자동화 앱·공유로 열린 기록 (진단용, 최근 10개): { at, q(받은 내용 요약), result }
  s.settings.inLog = (Array.isArray(st.inLog) ? st.inLog : []).filter(x => x && typeof x === 'object')
    .map(x => ({ at: num(x.at), q: str(x.q, 400), result: str(x.result, 120) })).slice(-10);
  return s;
}

let storageOK = false;
function loadState() {
  try {
    const probe = STORAGE_KEY + '.probe';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
    storageOK = true;
  } catch (e) {
    storageOK = false;          // 저장소를 쓸 수 없는 환경 (미리보기 등)
    return emptyState();
  }
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return emptyState();
  try {
    return normalize(JSON.parse(raw));
  } catch (e) {
    // 저장된 내용이 망가졌다면 지우지 않고 따로 보관
    try { localStorage.setItem(STORAGE_KEY + '.broken.' + Date.now(), raw); } catch (e2) { /* 무시 */ }
    return emptyState();
  }
}
function saveState() {
  if (!storageOK) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { toast('저장에 실패했어요. 휴대폰 저장공간을 확인해 주세요.'); }
}
// 크롬이 저장공간 부족 시 데이터를 자동으로 지우지 않도록 요청
async function requestPersist() {
  try {
    if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) {
      await navigator.storage.persist();
    }
  } catch (e) { /* 지원하지 않는 브라우저 */ }
}

/* =========================================================
   3) 계산 (잔액 · 합계)
   ---------------------------------------------------------
   자산 금액 = 마지막으로 직접 입력한 금액
             + 그 이후 이 자산으로 기록한 (들어온 돈 − 나간 돈)
   · 이체: 보내는 곳은 −, 받는 곳은 + (순자산은 그대로)
   · 대출·부채는 반대: 그 부채로 결제하면 늘고, 이체로 갚으면 줄어듦
   ========================================================= */
const isLiab = a => !!a && TYPE[a.type] && TYPE[a.type].kind === 'liability';

const assetById = id => (id ? state.assets.find(a => a.id === id) : null) || null;
// 계좌 이름 (지워진 계좌면 '삭제된 계좌')
const accName = id => { if (!id) return ''; const a = assetById(id); return a ? a.name : '삭제된 계좌'; };
const isCard = a => !!a && a.type === 'card';
const cards = () => state.assets.filter(isCard);

// 이 자산의 금액을 바꾼 기록 목록: [{ t, delta(금액 변화), dir('in'|'out') }]
function effectsOn(a) {
  const out = [];
  for (const t of state.txs) {
    if (t.kind === 'transfer') {
      if (t.accountId === a.id && t.appliedAt > a.baseAt) out.push({ t, delta: -t.amount * sideSign(a), dir: 'out' });
      if (t.toAccountId === a.id && t.toAppliedAt > a.baseAt) out.push({ t, delta: t.amount * sideSign(a), dir: 'in' });
    } else if (t.accountId === a.id && t.appliedAt > a.baseAt) {
      const flow = t.kind === 'income' ? t.amount : -t.amount;   // 계좌로 들어오면 +
      out.push({ t, delta: flow * sideSign(a), dir: t.kind === 'income' ? 'in' : 'out' });

const balanceOf = a => effectsOn(a).reduce((sum, e) => sum + e.delta, a.baseAmount);

/* ---- 신용카드 ----
   카드로 쓴 돈 = 가계부 지출 + 카드값(결제할 금액) 증가 → 통장은 그대로
   카드값 결제 = 통장 → 카드 이체 → 통장 −, 카드값 − (지출로 두 번 잡히지 않음) */
// 이 달에 이 카드로 쓴 돈 (날짜 기준)
const cardSpend = (card, ym) => state.txs.reduce((s, t) => s + (t.kind === 'expense' && t.accountId === card.id && t.date.startsWith(ym) ? t.amount : 0), 0);
// 결제할 금액 중 '지난달까지 쓴 금액' (이번 달 사용분 제외)
function cardPrevUnpaid(card) {
  const first = thisMonth() + '-01';
  const thisMonthCharges = effectsOn(card).reduce((s, e) => s + (e.t.kind !== 'transfer' && e.t.date >= first ? e.delta : 0), 0);
  return Math.max(0, balanceOf(card) - thisMonthCharges);
}
function payInfo(card) {
  if (!card.payDay) return { text: '결제일 미정', dd: null };
  return { text: `매월 ${card.payDay}일 결제`, dd: daysUntil(nextPayDate(card.payDay)) };
}
const ddayBadge = dd => (dd === null || dd === undefined ? '' : `<span class="dday${dd === 0 ? ' today' : ''}">${dd === 0 ? '오늘' : 'D-' + dd}</span>`);
// 오늘이 결제일이고, 지난달까지 쓴 금액이 아직 남은 카드 (결제를 기록하면 알림이 사라짐)
const dueToday = () => cards().filter(c => c.payDay && daysUntil(nextPayDate(c.payDay)) === 0 && cardPrevUnpaid(c) > 0);

function totals() {
  let assets = 0, liabilities = 0;
  const byType = {};
  for (const a of state.assets) {
    const b = balanceOf(a);
    byType[a.type] = (byType[a.type] || 0) + b;
    if (isLiab(a)) liabilities += b; else assets += b;
  }
  return { assets, liabilities, net: assets - liabilities, byType };
}
const newestFirst = (a, b) => (a.date === b.date ? b.createdAt - a.createdAt : (a.date < b.date ? 1 : -1));
function monthStats(ym) {
  let income = 0, expense = 0, transfer = 0, card = 0;
  const list = [];
  for (const t of state.txs) {
    if (!t.date.startsWith(ym)) continue;
    list.push(t);
    if (t.kind === 'income') income += t.amount;
    else if (t.kind === 'expense') { expense += t.amount; if (isCard(assetById(t.accountId))) card += t.amount; }
    else transfer += t.amount;              // 이체는 수입·지출에 넣지 않음
  }
  list.sort(newestFirst);
  return { income, expense, transfer, card, net: income - expense, list };
}

    .replace(/\*+\d+/g, ' ')                                             // ***1234
    .replace(/\(\d{3,4}\)/g, ' ')                                        // (1234)

const SMS_AMOUNT = /(누적|잔액|잔여|한도|합계|누계|가능|총)?\s*[:：]?\s*(\d{1,3}(?:,\d{3})+|\d+)\s*(원|KRW|₩)?/g;

  const first = flat.slice(0, 20);

  const t = norm(p.text);
  const keyed = state.assets.filter(a => a.smsKey && a.smsKey.split(/[\s,]+/).filter(Boolean).every(k => t.includes(norm(k))));

  if (!p.brand) return [];

  const where = `${p.brand ? p.brand + (p.isCard ? '카드' : '은행') : '어디서 왔는지 모르는'} ${p.app ? '알림' : '문자'}`;
  const notes = [`📩 ${where} · ${shortDate(p.date)}${p.time ? ' ' + p.time : ''} — 내용을 확인하고 [기록하기]를 누르세요.`];
  if (p.cancel) notes.push('취소·환불 문자라 돈이 다시 들어온 것으로 채웠어요.');
  if (!src) notes.push(p.brand ? `'${p.brand}' 이름이 들어간 계좌(카드)가 없어서 결제수단은 비워 뒀어요.` : '어느 계좌인지 못 찾아서 결제수단은 직접 골라 주세요.');
  else if (cands.length > 1) notes.push(`'${p.brand}' 계좌가 ${cands.length}개라 '${src.name}'을(를) 골랐어요. 아니면 바꿔 주세요. (자산 수정의 '문자 식별 단어'로 구분할 수 있어요)`);

  if (p.kind === 'expense' && !p.isCard && src && p.memo) {
    const nm = norm(p.memo);
    const target = state.assets.find(a => a.id !== src.id && a.type !== 'realestate' &&
      (nm.includes(norm(a.name)) || (isCard(a) && /카드/.test(p.memo) && smsBrand(p.memo) === smsBrand(a.name))));
    if (target) {
      Object.assign(preset, { kind: 'transfer', from: src.id, to: target.id });
      notes.push(`'${target.name}'(으)로 보낸 돈 같아서 이체로 채웠어요. 아니면 위에서 '지출'을 누르세요.`);

  if (state.settings.smsSeen.includes(p.hash)) preset.warn = '이 문자는 전에 기록한 적이 있어요. 중복이면 닫아 주세요.';
  else if (state.txs.some(t => t.date === p.date && t.amount === p.amount && t.kind === p.kind)) preset.warn = '같은 날 같은 금액의 기록이 이미 있어요. 중복이 아닌지 확인해 주세요.';
  preset.note = notes.join(' ');
  return preset;
}

      <p>이 화면에서는 입력한 내용이 저장되지 않아요. 휴대폰 크롬에서 열면 정상적으로 저장돼요.</p></div></section>`;
  }
  if (ui.tab === 'home' || ui.tab === 'cards') {
    for (const c of dueToday()) {
      h += `<section class="card notice pay" role="note"><div class="grow"><b>오늘은 ${esc(c.name)} 결제일이에요</b>
        <p>지난달까지 쓴 금액 ${won(cardPrevUnpaid(c))} · 통장에서 나갔으면 기록해 주세요.</p></div>
        <button class="btn primary small" type="button" data-action="pay-card" data-id="${esc(c.id)}">결제 기록</button></section>`;
    }
  }

    h += `<section class="card notice install"><div class="grow"><b>홈 화면에 앱으로 설치</b>

  return h;
}

// 가계부 한 줄
function txRow(t, showDate = false, inSheet = false) {
  const date = showDate ? shortDate(t.date) : '';
  const act = inSheet ? 'edit-tx-sheet' : 'edit-tx';   // 시트(분류 상세) 안에서는 그 자리에서 수정 화면으로
  const auto = t.src === 'auto' ? '📩 ' : '';                 // 문자·알림으로 자동 기록된 것
  if (t.kind === 'transfer') {
    const toCard = isCard(assetById(t.toAccountId));
    const to = accName(t.toAccountId);
    const from = accName(t.accountId);
    const sub = [date, from ? `${from}에서` : '', auto + t.memo].filter(Boolean).join(' · ');
    const title = !t.toAccountId ? '이체 (받는 곳 확인 필요)' : !t.accountId ? `${to}${josaRo(to)} 이체 (보낸 곳 확인 필요)`
      : toCard ? `${to} 카드값 결제` : `${to}${josaRo(to)} 이체`;
    return `<li><button class="row" type="button" data-action="${act}" data-id="${esc(t.id)}">
      <span class="row-icon" aria-hidden="true">${toCard ? '💳' : '🔁'}</span>
      <span class="row-main"><span class="row-title">${esc(title)}</span>${sub ? `<span class="row-sub">${esc(sub)}</span>` : ''}</span>
      <span class="row-amt transfer">${won(t.amount)}</span>
    </button></li>`;
  }
  const c = CAT[t.category] || { label: '기타', icon: '📌' };
  const acc = accName(t.accountId);
  const sub = [date, auto + (t.memo || (auto ? '알림' : '')), acc && isCard(assetById(t.accountId)) ? '💳 ' + acc : acc].filter(Boolean).join(' · ');
  const signed = t.kind === 'income' ? t.amount : -t.amount;
  return `<li><button class="row" type="button" data-action="${act}" data-id="${esc(t.id)}">
    <span class="row-icon" aria-hidden="true">${c.icon}</span>
    <span class="row-main"><span class="row-title">${esc(c.label)}</span>${sub ? `<span class="row-sub">${esc(sub)}</span>` : ''}</span>
    <span class="row-amt${t.kind === 'income' ? ' income' : ''}">${won(signed, { sign: true })}</span>
  </button></li>`;
}

function sumRows(M) {
  return `<div class="sumrows">
    <div class="sumrow"><span class="k">수입</span><span class="v income">${won(M.income, { sign: true })}</span></div>
    <div class="sumrow"><span class="k">지출</span><span class="v">${won(-M.expense, { sign: true })}</span></div>
    ${M.card ? `<div class="sumrow sub"><span class="k">└ 그중 카드</span><span class="v">${won(M.card)}</span></div>` : ''}
    <div class="sumrow total"><span class="k">남은 돈</span><span class="v">${won(M.net, { sign: true })}</span></div>
    ${M.transfer ? `<div class="sumrow xfer"><span class="k">이체 (계좌 간 이동)</span><span class="v">${won(M.transfer)}</span></div>` : ''}
  </div>`;
}

// 자산 구성: 한 줄 막대(종류별 비율) + 범례 목록(금액·비율)
function compositionCard(T) {
  const items = ASSET_TYPES.filter(t => t.kind === 'asset')
    .map(t => ({ t, v: Math.max(0, T.byType[t.id] || 0) }))
    .filter(x => x.v > 0);
  const total = items.reduce((s, x) => s + x.v, 0);
  if (!total) return '';
  const pct = v => v / total * 100;
  const pctText = v => (pct(v) < 0.1 ? '0.1% 미만' : pct(v).toFixed(1) + '%');
  const act = ui.seg && items.some(x => x.t.id === ui.seg) ? ui.seg : null;
  const debt = T.liabilities > 0 && T.assets > 0
    ? `<p class="ratio"><span>총자산 대비 부채</span><b>${(T.liabilities / T.assets * 100).toFixed(1)}%</b></p>` : '';
  return `<section class="card">
    <div class="card-head"><h2>자산 구성</h2><span class="muted-s">부채 제외 · 종류별</span></div>
    <div class="stack${act ? ' has-active' : ''}" aria-hidden="true">
      ${items.map(x => `<button type="button" tabindex="-1" class="seg${act === x.t.id ? ' active' : ''}" data-action="seg" data-id="${x.t.id}" style="flex-grow:${pct(x.v).toFixed(3)};background:var(--c${x.t.color})"></button>`).join('')}
    </div>
    <ul class="legend${act ? ' has-active' : ''}" aria-label="자산 종류별 금액과 비율">
      ${items.map(x => `<li class="${act === x.t.id ? 'active' : ''}" data-action="seg" data-id="${x.t.id}">
        <span class="dot" style="background:var(--c${x.t.color})"></span>
        <span class="name">${esc(x.t.label)}</span>
        <span class="pct">${pctText(x.v)}</span>
        <span class="amt">${won(x.v)}</span></li>`).join('')}
    </ul>
    ${debt}
  </section>`;
}

function assetRow(a) {
  // 가장 최근에 금액을 바꾼 기록을 보여줌 (예: 최근 −300,000원 · 저축보험으로 이체)
  const effects = effectsOn(a).sort((x, y) => newestFirst(x.t, y.t));

  if (isCard(a)) {
    const ym = thisMonth();
    sub = esc(`${Number(ym.slice(5))}월 사용 ${won(cardSpend(a, ym))}` + (a.payDay ? ` · 매월 ${a.payDay}일 결제` : ''));
  } else if (effects.length) {
    const e = effects[0];
    const cls = !isLiab(a) && e.delta > 0 ? ' class="income"' : '';
    sub = `최근 <span${cls}>${won(e.delta, { sign: true })}</span> · ${esc(effectTitle(e))}`;
  } else {
    sub = esc([a.baseAt ? shortDate(ymd(new Date(a.baseAt))) + ' 기준' : '', a.memo].filter(Boolean).join(' · '));

  return `<li><button class="row" type="button" data-action="view-asset" data-id="${esc(a.id)}">

// 가계부 화면
function monthNav(ym) {
  let h = `<div class="month-nav">
    <button class="icon-btn" type="button" data-action="month-prev" aria-label="이전 달">${ICON.chevL}</button>
    <h2 id="month-title">${monthLabel(ym)}</h2>
    <button class="icon-btn" type="button" data-action="month-next" aria-label="다음 달">${ICON.chevR}</button>
  </div>`;
  if (ym !== thisMonth()) h += '<div class="center"><button class="pill" type="button" data-action="month-now">이번 달로 돌아가기</button></div>';
  return h;
}
function dayGroups(list) {
  const days = new Map();
  for (const t of list) {
    if (!days.has(t.date)) days.set(t.date, []);
    days.get(t.date).push(t);
  }
  let h = '';
  for (const [d, items] of days) {
    const inc = items.filter(t => t.kind === 'income').reduce((s, t) => s + t.amount, 0);
    const exp = items.filter(t => t.kind === 'expense').reduce((s, t) => s + t.amount, 0);
    const parts = [];
    if (inc) parts.push(`<span class="income">${won(inc, { sign: true })}</span>`);
    if (exp) parts.push(`<span>${won(-exp, { sign: true })}</span>`);
    h += `<section class="day"><div class="day-head"><span>${dateLabel(d)}</span><span class="ds">${parts.join('')}</span></div>
      <ul class="list card">${items.map(t => txRow(t)).join('')}</ul></section>`;
  }
  return h;
}
function viewLedger() {
  let h = notices() + draftBanner() + autoBanner() + inboxBanner() + ledgerModeTabs();
  if (ui.ledgerMode === 'period') return h + viewPeriod();
  const ym = ui.month;
  const M = monthStats(ym);
  h += monthNav(ym);
  h += `<section class="card">${sumRows(M)}</section>`;

  const byCat = {};
  for (const t of M.list) if (t.kind === 'expense') byCat[t.category] = (byCat[t.category] || 0) + t.amount;
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (rows.length) {
    const max = rows[0][1];
    h += `<section class="card"><div class="card-head"><h2>분류별 지출</h2><button class="link" type="button" data-action="period-from-month">기간 통계 ›</button></div>
      <ul class="catbars">${rows.map(([id, v]) => {
        const c = CAT[id] || { label: '기타', icon: '📌' };
        return `<li><div class="cb-top"><span class="cb-name"><span aria-hidden="true">${c.icon}</span> ${esc(c.label)}</span>
          <span class="cb-pct">${(v / M.expense * 100).toFixed(1)}%</span><span class="cb-val">${won(v)}</span></div>
          <div class="cb-track" aria-hidden="true"><span class="cb-bar" style="width:${(v / max * 100).toFixed(2)}%"></span></div></li>`;
      }).join('')}</ul></section>`;
  }

  if (!M.list.length) {
    h += `<section class="card empty"><div class="big" aria-hidden="true">📝</div>
      <h2>이 달의 기록이 없어요</h2>
      <p>오른쪽 아래 <b>+</b> 버튼으로<br>쓴 돈 · 들어온 돈 · 이체를 기록해 보세요.</p></section>`;
    return h;
  }
  return h + dayGroups(M.list);
}

/* ---------------------------------------------------------
   기간 통계 (v1.3): 최대 12개월 동안 분류별 수입·지출 합계
   예) 8월 부수입, 8월 급여·수입 합계, 1~3월 식비 합계
   --------------------------------------------------------- */
const MAX_MONTHS = 12;
const PRESETS = [['this', '이번 달'], ['last', '지난달'], ['3m', '최근 3개월'], ['year', '올해'], ['12m', '최근 12개월']];
function presetRange(id) {
  const cur = thisMonth();
  const r = { this: [cur, cur], last: [shiftMonth(cur, -1), shiftMonth(cur, -1)], '3m': [shiftMonth(cur, -2), cur],
    year: [cur.slice(0, 4) + '-01', cur], '12m': [shiftMonth(cur, -(MAX_MONTHS - 1)), cur] }[id] || [cur, cur];
  return { start: r[0], end: r[1], preset: id };
}
function monthsBetween(a, b) {
  const out = [];
  for (let m = a; m <= b && out.length < 600; m = shiftMonth(m, 1)) out.push(m);
  return out;
}
const rangeLabel = (a, b) => (a === b ? monthLabel(a) : `${monthLabel(a)} ~ ${monthLabel(b)}`);
const shortMonth = (m, withYear) => (withYear ? `${m.slice(2, 4)}년 ${Number(m.slice(5))}월` : `${Number(m.slice(5))}월`);
const cell = (n, signed) => (state.settings.hideAmounts ? '•••' : (signed && n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)));
// 고를 수 있는 달: 2년 전 ~ 이번 달 (기록이 더 예전·나중이면 거기까지)
function monthOptions(selected) {
  const cur = thisMonth();
  let first = shiftMonth(cur, -23), last = cur;
  for (const t of state.txs) { const m = t.date.slice(0, 7); if (m < first) first = m; if (m > last) last = m; }
  return monthsBetween(first, last).reverse()
    .map(m => `<option value="${m}"${m === selected ? ' selected' : ''}>${monthLabel(m)}</option>`).join('');
}
function periodStats(start, end) {
  const from = start + '-01', to = end + '-31';
  const months = monthsBetween(start, end);
  const byMonth = Object.fromEntries(months.map(m => [m, { income: 0, expense: 0 }]));
  const inc = {}, exp = {};
  let income = 0, expense = 0, transfer = 0, card = 0, count = 0;
  for (const t of state.txs) {
    if (t.date < from || t.date > to) continue;
    const bm = byMonth[t.date.slice(0, 7)];
    if (t.kind === 'income') {
      income += t.amount; inc[t.category] = (inc[t.category] || 0) + t.amount; if (bm) bm.income += t.amount; count++;
    } else if (t.kind === 'expense') {
      expense += t.amount; exp[t.category] = (exp[t.category] || 0) + t.amount; if (bm) bm.expense += t.amount; count++;
      if (isCard(assetById(t.accountId))) card += t.amount;
    } else {
      transfer += t.amount;                 // 이체·카드값 결제는 수입·지출에 넣지 않음
    }
  }
  return { months, byMonth, inc, exp, income, expense, transfer, card, net: income - expense, count };
}
function ledgerModeTabs() {
  const b = (id, label) => `<button type="button" data-action="ledger-mode" data-id="${id}" aria-pressed="${ui.ledgerMode === id}">${label}</button>`;
  return `<div class="seg-tabs" role="group" aria-label="가계부 보기">${b('month', '월별 내역')}${b('period', '기간 통계')}</div>`;
}
function catCard(kind, title, map, total) {
  const rows = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const isInc = kind === 'income';
  const body = rows.length ? rows.map(([id, v]) => {
    const c = CAT[id] || { label: '기타', icon: '📌' };
    return `<li><button class="catrow" type="button" data-action="cat-stats" data-kind="${kind}" data-id="${esc(id)}">
      <span class="cb-top"><span class="cb-name"><span aria-hidden="true">${c.icon}</span> ${esc(c.label)}</span>
        <span class="cb-pct">${(v / total * 100).toFixed(1)}%</span><span class="cb-val${isInc ? ' income' : ''}">${won(v)}</span></span>
      <span class="cb-track" aria-hidden="true"><span class="cb-bar" style="width:${(v / rows[0][1] * 100).toFixed(2)}%"></span></span>
    </button></li>`;
  }).join('') : `<li class="empty-li">이 기간에 ${isInc ? '수입' : '지출'} 기록이 없어요.</li>`;
  return `<section class="card" id="cat-${kind}"><div class="card-head"><h2>${title}</h2><span class="muted-s">누르면 월별·기록</span></div>
    <ul class="catbars">${body}</ul>
    <div class="cat-total"><span>${isInc ? '수입' : '지출'} 합계</span><span class="${isInc ? 'income' : ''}" id="cat-${kind}-total">${won(total)}</span></div>
  </section>`;
}
function viewPeriod() {
  const P = ui.period;
  const S = periodStats(P.start, P.end);
  let h = `<section class="card period">
    <div class="presets" role="group" aria-label="빠른 기간 선택">
      ${PRESETS.map(([id, label]) => `<button type="button" data-action="period-preset" data-id="${id}" aria-pressed="${P.preset === id}">${label}</button>`).join('')}
    </div>
    <div class="period-range">
      <select class="input" id="p-start" aria-label="시작 월">${monthOptions(P.start)}</select>

// 분류 하나를 누르면: 기간 합계 · 월별 · 기록 목록
function openCatStats(kind, cat) {
  const { start, end } = ui.period;
  const months = monthsBetween(start, end);
  const from = start + '-01', to = end + '-31';
  const list = state.txs.filter(t => t.kind === kind && t.category === cat && t.date >= from && t.date <= to).sort(newestFirst);
  const byM = Object.fromEntries(months.map(m => [m, 0]));
  for (const t of list) { const m = t.date.slice(0, 7); if (m in byM) byM[m] += t.amount; }
  const total = list.reduce((sum, t) => sum + t.amount, 0);
  const c = CAT[cat] || { label: '기타', icon: '📌' };
  const max = Math.max(1, ...Object.values(byM));
  const multiYear = start.slice(0, 4) !== end.slice(0, 4);
  const shown = list.slice(0, 100);
  const html = `<div class="detail">
    <div class="detail-type"><span aria-hidden="true">${c.icon}</span>${kind === 'income' ? '수입' : '지출'} · ${esc(rangeLabel(start, end))}</div>
    <div class="detail-bal${kind === 'income' ? ' income' : ''}" id="cat-detail-total">${won(total)}</div>
    <div class="detail-sub">${months.length}개월${months.length > 1 ? ` · 월평균 ${won(Math.round(total / months.length))}` : ''} · ${list.length}건</div>
    ${months.length > 1 ? `<h3 class="sheet-section">월별</h3>
    <ul class="catbars" id="cat-detail-months">${months.map(m => `<li><div class="cb-top"><span class="cb-name">${esc(shortMonth(m, multiYear))}</span><span class="cb-val">${won(byM[m])}</span></div>
      <div class="cb-track" aria-hidden="true">${byM[m] ? `<span class="cb-bar" style="width:${(byM[m] / max * 100).toFixed(2)}%"></span>` : ''}</div></li>`).join('')}</ul>` : ''}

/* =========================================================
   5) 시트(입력 화면) · 확인창 · 알림  + 휴대폰 '뒤로' 버튼 처리
   ========================================================= */
const layers = [];        // 열려 있는 시트/확인창 (위에 있는 것이 마지막)
let ignorePop = 0, pendingBack = 0, backTimer = 0;

function pushLayer(layer) {
  layers.push(layer);
  history.pushState({ myassetLayer: layers.length }, '');
}
// 화면 안의 [닫기]·[저장] 등으로 닫을 때
function closeLayers(n = 1) {
  n = Math.min(n, layers.length);
  if (!n) return;
  for (let i = 0; i < n; i++) layers.pop().hide();
  pendingBack += n;
  clearTimeout(backTimer);
  backTimer = setTimeout(() => {
    const k = pendingBack;
    pendingBack = 0;
    if (k) { ignorePop++; history.go(-k); }
  }, 0);
}
// 휴대폰 '뒤로' 버튼을 누르면 맨 위 창만 닫기
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  const l = layers.pop();
  if (l) l.hide();
});

let lastFocus = null;
// replace: true 이면 이미 열린 시트의 내용만 바꿈 (예: 계좌 상세 → 수정 화면)
function openSheet(title, html, mount, opts = {}) {
  const sheet = $('#sheet'), bd = $('#sheet-backdrop'), body = $('#sheet-body');
  const top = layers[layers.length - 1];
  const replacing = !!opts.replace && !!top && top.hide === hideSheet && sheet.classList.contains('show');
  if (!replacing) lastFocus = document.activeElement;
  $('#sheet-title').textContent = title;
  body.innerHTML = html;
  if (!replacing) {
    sheet.hidden = false; bd.hidden = false;
    void sheet.offsetHeight;                     // 애니메이션 시작점 확정
    sheet.classList.add('show'); bd.classList.add('show');
    document.body.classList.add('locked');
    pushLayer({ hide: hideSheet });
  }
  body.scrollTop = 0;     // 보이게 한 다음에 맨 위로 (숨겨진 동안엔 적용되지 않아 이전 스크롤이 남았음)
  if (mount) mount(body);
}
function hideSheet() {
  const sheet = $('#sheet'), bd = $('#sheet-backdrop');
  if (sheet.querySelector('#tx-form')) clearDraft();           // 입력창을 직접 닫으면 임시 저장도 버림
  sheet.classList.remove('show'); bd.classList.remove('show');
  document.body.classList.remove('locked');
  if (document.activeElement && sheet.contains(document.activeElement)) document.activeElement.blur();
  setTimeout(() => {
    if (!sheet.classList.contains('show')) { sheet.hidden = true; bd.hidden = true; $('#sheet-body').innerHTML = ''; }
  }, 260);
  if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }
}

function confirmDialog({ title, message = '', ok = '확인', danger = false }) {
  return new Promise(resolve => {
    const dlg = $('#dialog'), bd = $('#dialog-backdrop'), okBtn = $('#dialog-ok'), cancelBtn = $('#dialog-cancel');
    $('#dialog-title').textContent = title;
    $('#dialog-msg').textContent = message;
    okBtn.textContent = ok;
    okBtn.className = 'btn ' + (danger ? 'danger' : 'primary');
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    dlg.hidden = false; bd.hidden = false;
    void dlg.offsetHeight;
    dlg.classList.add('show'); bd.classList.add('show');
    pushLayer({
      hide() {
        dlg.classList.remove('show'); bd.classList.remove('show');
        setTimeout(() => { if (!dlg.classList.contains('show')) { dlg.hidden = true; bd.hidden = true; } }, 180);
        finish(false);
      },
    });
    okBtn.onclick = () => { finish(true); closeLayers(1); };
    cancelBtn.onclick = () => closeLayers(1);
    setTimeout(() => cancelBtn.focus(), 30);
  });
}

let toastTimer = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

   6) 계좌 상세 (금액이 바뀐 기록: 나간 돈 −, 들어온 돈 +)
   ========================================================= */
// 이 자산 입장에서 본 기록 이름: "저축보험으로 이체" / "국민은행 통장에서 이체" / "식비"
function effectTitle({ t, dir }) {
  if (t.kind !== 'transfer') return (CAT[t.category] || { label: '기타' }).label;
  const toCard = isCard(assetById(t.toAccountId));
  if (dir === 'out') { const to = accName(t.toAccountId) || '받는 곳 없음'; return toCard ? `${to} 카드값 결제` : `${to}${josaRo(to)} 이체`; }
  const from = accName(t.accountId) || '보낸 곳 없음';
  return toCard ? `카드값 결제 (${from}에서)` : `${from}에서 이체`;
}
function historyRow(e, liab) {
  const { t, delta } = e;
  const title = effectTitle(e);
  const sub = [shortDate(t.date), t.memo].filter(Boolean).join(' · ');
  const cls = !liab && delta > 0 ? ' plus' : '';
  return `<li><span class="h-main"><span class="h-title">${esc(title)}</span><span class="h-sub">${esc(sub)}</span></span>
    <span class="h-amt${cls}">${won(delta, { sign: true })}</span></li>`;
}
function openAssetDetail(id, opts = {}) {
  const a = assetById(id);
  if (!a) return;
  const ty = TYPE[a.type];
  const liab = isLiab(a);
  const bal = balanceOf(a);
  const effects = effectsOn(a).sort((x, y) => newestFirst(x.t, y.t));
  const shown = effects.slice(0, 30);
  const approx = !state.settings.hideAmounts && Math.abs(bal) >= 1e4 ? ' · 약 ' + koreanApprox(bal) : '';
  const baseDay = a.baseAt ? shortDate(ymd(new Date(a.baseAt))) : '';
  const card = isCard(a);
  const pi = card ? payInfo(a) : null;
  const subLabel = card ? `결제할 카드값${a.payDay ? ' · ' + pi.text : ''}${a.payAccountId && assetById(a.payAccountId) ? ' · ' + accName(a.payAccountId) : ''}`
    : (liab ? '남은 부채' : '현재 금액') + approx;
  const html = `<div class="detail">
    <div class="detail-type"><span class="dot" style="background:var(--c${ty.color})"></span>${esc(ty.label)}${a.memo ? ' · ' + esc(a.memo) : ''}</div>
    <div class="detail-bal" id="detail-bal">${won(bal)}</div>
    <div class="detail-sub">${esc(subLabel)} ${card ? ddayBadge(pi.dd) : ''}</div>
    <div class="detail-actions">
      <button class="btn" type="button" data-role="edit">수정</button>
      <button class="btn primary" type="button" data-role="transfer">${card ? '카드값 결제' : liab ? '갚기 (이체)' : '이체하기'}</button>
    </div>
    <h3 class="sheet-section">${card ? '카드값이 바뀐 기록 (+ 사용 · − 결제)' : liab ? '부채가 바뀐 기록' : '금액이 바뀐 기록'}</h3>
    <ul class="history" id="detail-history">
      ${shown.map(e => historyRow(e, liab)).join('')}
      <li class="h-base"><span class="h-main"><span class="h-title">직접 입력한 금액</span>
        <span class="h-sub">${esc([baseDay ? baseDay + ' 입력' : '', '여기에 위 기록이 더해지고 빠져요'].filter(Boolean).join(' · '))}</span></span>
        <span class="h-amt">${won(a.baseAmount)}</span></li>
    </ul>
    ${effects.length > shown.length ? `<p class="hint center">최근 ${shown.length}건만 보여요 (모두 ${effects.length}건)</p>` : ''}
    <div class="sheet-end"></div>
  </div>`;
  openSheet(a.name, html, root => {
    root.querySelector('[data-role="edit"]').addEventListener('click', () => openAssetForm(a.id, { replace: true }));
    root.querySelector('[data-role="transfer"]').addEventListener('click', () => {
      if (card) openCardPay(a.id, { replace: true });
      else openTxForm(null, { replace: true, preset: liab ? { kind: 'transfer', to: a.id } : { kind: 'transfer', from: a.id } });
    });
  }, opts);
}

// [카드값 결제]: 통장 → 카드 이체를 금액까지 미리 채워서 열기
function openCardPay(cardId, opts = {}) {
  const c = assetById(cardId);
  if (!c) return;
  const full = Math.max(0, balanceOf(c));
  const prev = cardPrevUnpaid(c);
  openTxForm(null, { ...opts, title: `${c.name} 카드값 결제`, preset: { kind: 'transfer', from: c.payAccountId, to: c.id, amount: prev > 0 ? prev : full, memo: `${new Date().getMonth() + 1}월 카드값` } });
}

/* =========================================================
   7) 자산 추가 · 수정 화면
   ========================================================= */
function openAssetForm(id, opts = {}) {
  const a = id ? assetById(id) : null;
  if (id && !a) return;
  const typeId = a ? a.type : (TYPE[opts.presetType] ? opts.presetType : 'cash');
  const bal = a ? balanceOf(a) : 0;

      <p class="hint reading" id="a-reading" aria-live="polite"></p>
      ${pending ? `<p class="hint">이 금액에는 가계부 기록 ${pending}건이 반영되어 있어요. 숫자를 직접 고치면 고친 금액이 새 기준이 돼요.</p>` : ''}
      ${a && bal < 0 ? `<p class="hint">현재 금액은 ${esc(won(bal))}이에요. 새 금액을 입력하면 그 금액으로 바뀌어요.</p>` : ''}
    </div>
    <div class="field-row2" id="a-card-fields">

      </div>
    </div>
    <div class="field">
      <label class="label" for="a-memo">메모 <span class="opt">(선택)</span></label>
      <input class="input" id="a-memo" maxlength="100" value="${esc(a ? a.memo : '')}" placeholder="예) 만기 2027.03, 금리 3.5%">
    </div>
    <div class="field" id="a-smskey-field">
      <label class="label" for="a-smskey">문자 식별 단어 <span class="opt">(선택)</span></label>
      <input class="input" id="a-smskey" maxlength="40" value="${esc(a ? a.smsKey : '')}" placeholder="예) 신한카드 1234 (문자에 나오는 이름·끝 4자리)">
      <p class="hint">은행·카드 문자를 넣을 때 이 계좌를 알아보는 말이에요. 비워 두면 이름에 있는 은행·카드사 이름으로 찾아요. 여러 단어를 띄어 쓰면 모두 들어 있어야 해요.</p>
    </div>
    <p class="hint" id="a-link-note"></p>

  openSheet(a ? '자산 수정' : '자산 추가', html, root => {
    const nameEl = $('#a-name', root), amtEl = $('#a-amount', root), memoEl = $('#a-memo', root), errEl = $('#a-error', root);
    const payDayEl = $('#a-payday', root), payAccEl = $('#a-payacc', root);
    if (a && a.payAccountId && state.assets.some(x => x.id === a.payAccountId)) payAccEl.value = a.payAccountId;
    let touched = false;     // 금액을 직접 고쳤는지
    const curType = () => { const r = root.querySelector('input[name="atype"]:checked'); return r ? r.value : 'cash'; };
    const sync = () => {
      const t = TYPE[curType()];
      $('#a-type-hint', root).textContent = t.hint;
      nameEl.placeholder = t.ph;
      $('#a-amount-label', root).textContent = t.amountLabel;
      $('#a-card-fields', root).hidden = t.id !== 'card';
      $('#a-smskey-field', root).hidden = t.id === 'realestate';

        : t.kind === 'liability'

        : '가계부에서 이 자산을 고르면 쓴 돈·들어온 돈·이체 금액이 자동으로 반영돼요.';

    const reading = () => { const n = parseAmount(amtEl.value); $('#a-reading', root).textContent = n >= 1e4 ? koreanReading(n) : ''; };

      e.preventDefault();

      const type = curType();
      const name = nameEl.value.trim() || TYPE[type].label;
      const memo = memoEl.value.trim();
      const amount = parseAmount(amtEl.value);

      const payDay = type === 'card' ? Number(payDayEl.value) || 0 : 0;
      const payAccountId = type === 'card' ? payAccEl.value : '';
      const smsKey = type === 'realestate' ? '' : $('#a-smskey', root).value.trim().slice(0, 40);
      if (a) {
        Object.assign(a, { type, name, memo, payDay, payAccountId, smsKey, updatedAt: now });

      } else {
